# The D codes below are the docstring baseline: the codes each file broke
# when the D rules were switched on, 1225 findings in 51 files.  A file not
# listed passes every D rule.  A file whose gaps are fixed leaves its line;
# a line whose codes no longer occur is deleted with the fix.
