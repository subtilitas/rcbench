# The tools/ directory: single-purpose scripts that CI (continuous
# integration) runs, and their tests under test/tools/.  Held to the same
# standard as the C: no unused imports, no shadowed builtins, no bare
# excepts, and a line length that matches the rest of the tree.
line-length = 79
target-version = "py310"

[lint]
# Rule sets that catch bugs, not style.  UP, SIM and RUF report formatting
# preferences (% formatting against f-strings, concatenation against
# unpacking) and are off.
select = [
    "E",    # pycodestyle: layout, including the 79 columns the C tree uses
    "W",    # pycodestyle warnings
    "F",    # pyflakes: undefined names, unused imports, dead assignments
    "B",    # bugbear: the shapes that are usually a bug
    "D",    # pydocstyle: a Google-style docstring on every module, public
            # function, class and method (CONTRIBUTING.md, "Comments")
]
ignore = [
    # sys.exit(message) is how these tools report a fatal condition.
    "B904",
    # subprocess with a constructed argument list is the entire job of
    # frame_cost.py and coverage.py.
    "S603", "S607",
]

[lint.pydocstyle]
# A summary line, a blank line, then Args, Returns and Raises sections.
convention = "google"

[lint.per-file-ignores]
# gen_font.py carries the glyph tables it emits as long literal strings
# (E501).
