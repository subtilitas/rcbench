# Codecov configuration.
#
# The hard floors live in tools/coverage.py, which runs offline and fails the
# build: 94% overall and 85% for any single file.  Codecov's job is different
# and complementary -- it annotates the diff in a pull request, so a change can
# be seen to be tested rather than only measured in aggregate afterwards.
#
# The targets here are therefore set to match, not to compete.  If they ever
# disagree, tools/coverage.py is the one that decides.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "85...95"

  status:
    project:
      default:
        target: 94%
        # A rounding difference between gcovr and gcov is not a regression.
        threshold: 0.5%
    patch:
      default:
        # New code is held higher than the tree average, which is the whole
        # point of a patch target: the average is a legacy, the diff is a
        # choice.
        target: 90%
        threshold: 0%

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: true

ignore:
  # Generated glyph tables: thousands of lines of data with no branches, which
  # would drown every real number on the page.
  - "shared/gfx/gfx_font*.c"
  # Firmware is not built by the host suite and cannot be covered by it.
  - "firmware/**"
  - "test/**"
  - "tools/**"
