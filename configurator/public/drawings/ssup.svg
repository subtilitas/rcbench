<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 230 200" width="230" height="200" role="img" aria-labelledby="ssu-t" aria-describedby="ssu-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="ssu-t">Servo supply (yours)</title>
<desc id="ssu-d">Illustration of a servo supply with a plus and a minus terminal.</desc>
<defs>
<linearGradient id="ssu-tin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f8"/><stop offset=".5" stop-color="#c9ced4"/><stop offset="1" stop-color="#9aa1a9"/></linearGradient>
<linearGradient id="ssu-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9ad"/><stop offset=".5" stop-color="#dcb450"/><stop offset="1" stop-color="#a47a1e"/></linearGradient>
<linearGradient id="ssu-copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eeb184"/><stop offset=".5" stop-color="#c47c45"/><stop offset="1" stop-color="#8f5628"/></linearGradient>
<radialGradient id="ssu-ring" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#cfd3d8"/><stop offset="1" stop-color="#8e959d"/></radialGradient>
<linearGradient id="ssu-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3c42"/><stop offset="1" stop-color="#1b1c20"/></linearGradient>
<filter id="ssu-sh" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="ssu-s2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".7"/></filter>
<filter id="ssu-s3" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".45"/></filter>
<linearGradient id="ssu-bx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#565c66"/><stop offset="0.5" stop-color="#3a3f47"/><stop offset="1" stop-color="#272a30"/></linearGradient>
<linearGradient id="ssu-lcd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22303a"/><stop offset="1" stop-color="#111a20"/></linearGradient>
</defs>
<rect width="230" height="200" rx="10" fill="#efebe3"/>
<g filter="url(#ssu-sh)"><rect x="22" y="34" width="150" height="132" rx="6" fill="url(#ssu-bx)"/></g>
<path d="M38 52H110M38 62H110M38 72H110M38 82H110" stroke="#1b1c20" stroke-width="3" stroke-linecap="round"/>
<rect x="38" y="104" width="72" height="44" rx="3" fill="#0e1116"/><rect x="42" y="108" width="64" height="36" rx="2" fill="url(#ssu-lcd)"/><rect x="50" y="118" width="34" height="6" rx="2" fill="#5fbf8a" opacity=".8"/><rect x="50" y="130" width="22" height="5" rx="2" fill="#5fbf8a" opacity=".5"/>
<g filter="url(#ssu-s3)"><rect x="160" y="57" width="30" height="26" rx="5" fill="#c8261d"/></g><circle cx="190" cy="70" r="6" fill="url(#ssu-ring)" stroke="#5d646c" stroke-width=".8"/>
<g filter="url(#ssu-s3)"><rect x="160" y="117" width="30" height="26" rx="5" fill="#17181c"/></g><circle cx="190" cy="130" r="6" fill="url(#ssu-ring)" stroke="#5d646c" stroke-width=".8"/>
<text id="ssu-lbl-POS" x="142" y="77" font-size="20" font-weight="600" fill="#f2f2f2" text-anchor="middle">+</text>
<text id="ssu-lbl-NEG" x="142" y="137" font-size="20" font-weight="600" fill="#f2f2f2" text-anchor="middle">−</text>
