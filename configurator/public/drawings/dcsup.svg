<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 290 200" width="290" height="200" role="img" aria-labelledby="dcs-t" aria-describedby="dcs-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="dcs-t">DC supply for the Osoyoo breakout board, 7 to 12 V DC (yours)</title>
<desc id="dcs-d">Illustration of a plug-in DC supply with a plus and a minus lead. No product is chosen.</desc>
<defs>
<linearGradient id="dcs-tin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f8"/><stop offset=".5" stop-color="#c9ced4"/><stop offset="1" stop-color="#9aa1a9"/></linearGradient>
<linearGradient id="dcs-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9ad"/><stop offset=".5" stop-color="#dcb450"/><stop offset="1" stop-color="#a47a1e"/></linearGradient>
<linearGradient id="dcs-copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eeb184"/><stop offset=".5" stop-color="#c47c45"/><stop offset="1" stop-color="#8f5628"/></linearGradient>
<radialGradient id="dcs-ring" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#cfd3d8"/><stop offset="1" stop-color="#8e959d"/></radialGradient>
<linearGradient id="dcs-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3c42"/><stop offset="1" stop-color="#1b1c20"/></linearGradient>
<filter id="dcs-sh" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="dcs-s2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".7"/></filter>
<filter id="dcs-s3" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".45"/></filter>
<linearGradient id="dcs-dc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f57"/><stop offset="0.5" stop-color="#33373e"/><stop offset="1" stop-color="#22252a"/></linearGradient>
<linearGradient id="dcs-dcl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1ea"/><stop offset="1" stop-color="#dcd8cd"/></linearGradient>
</defs>
<rect width="290" height="200" rx="10" fill="#efebe3"/>
<rect x="6" y="76" width="18" height="8" rx="2" fill="url(#dcs-tin)"/><rect x="6" y="116" width="18" height="8" rx="2" fill="url(#dcs-tin)"/>
<g filter="url(#dcs-sh)"><rect x="22" y="44" width="116" height="112" rx="12" fill="url(#dcs-dc)"/></g>
