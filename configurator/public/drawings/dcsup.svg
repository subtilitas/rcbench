<rect x="132" y="90" width="16" height="20" rx="4" fill="#17181c"/>
<path d="M148 100C176 100 190 72 224 72H238" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,1.5)"/><path d="M148 100C176 100 190 72 224 72H238" fill="none" stroke="#c8261d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 100C176 100 190 72 224 72H238" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1.4)"/>
<path d="M148 100C176 100 190 132 224 132H238" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,1.5)"/><path d="M148 100C176 100 190 132 224 132H238" fill="none" stroke="#17181c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 100C176 100 190 132 224 132H238" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1.4)"/>
<rect x="236" y="66" width="24" height="12" rx="4.2" fill="url(#dcs-gold)" stroke="#5d646c" stroke-width=".6" filter="url(#dcs-s2)"/>
<rect x="236" y="126" width="24" height="12" rx="4.2" fill="url(#dcs-gold)" stroke="#5d646c" stroke-width=".6" filter="url(#dcs-s2)"/>
