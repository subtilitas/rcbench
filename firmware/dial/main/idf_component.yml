# The display drivers from the Espressif component registry, Apache-2.0:
# the GC9A01 of the M5Stack Dial, the one its board support package uses,
# and the ST77916 of the Guition JC3636K518C, which dial_k518_lcd.c drives
# with the vendor's set-up (dial_k518_init.h).  They are the Dial's only
# managed components; firmware/dial/dependencies.lock records their hashes.
# Each board's image links its own driver only.
dependencies:
  espressif/esp_lcd_gc9a01:
    version: "==2.0.4"
  espressif/esp_lcd_st77916:
    version: "==2.0.2"
