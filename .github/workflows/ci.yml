name: CI

on:
  push:
    branches: [main]
    # Tags too: a release is built from whatever commit was tagged, which is
    # not necessarily one that ever landed on main.  Publishing firmware no
    # host test has run against is the one gap worth closing here.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PICO_SDK_TAG: '2.3.0'

jobs:
  host-tests:
    name: Host suite, coverage and the checks that hold prose to the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc fonts-dejavu-core valgrind
          python3 -m pip install --upgrade pillow

      - name: Unit tests
        run: |
          cmake -S test/host -B test/host/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build test/host/build -j"$(nproc)"
          ctest --test-dir test/host/build --output-on-failure

      # The same suite under AddressSanitizer + UBSan, for the runtime faults
      # the -Werror build above cannot see: a parser reading off the end of a
      # frame, a signed shift overflowing, an unaligned access.  This code is
      # fed hostile bytes by design -- CSV, CAN, OpenYGE, S.BUS -- so a
      # buffer that a valid frame never reaches is exactly what a malformed
      # one will.  A separate build directory because the flags differ.
      - name: Unit tests under sanitizers
        run: |
          cmake -S test/host -B test/host/build-san -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON
          cmake --build test/host/build-san -j"$(nproc)"
          ctest --test-dir test/host/build-san --output-on-failure

      # Fails when the table in README.md no longer matches reality, rather
      # than committing a fixup nobody reads the diff of.
      - name: Coverage is current
        run: python3 tools/coverage.py --check --json coverage.json

      - name: The checked-in fonts match their generator
        run: python3 tools/gen_font.py --check

      # Links, the sidebar, the list of test binaries, and the tree that
      # Building.md prints.  None of these are claims a reader would check.
      - name: The docs agree with the tree
        run: python3 tools/check_docs.py

      # The wiki gets these pages with their links translated, and a broken
      # translator would only show up as a wiki full of downloads.  Run it
      # against a copy so a mistake fails here rather than there.
      - name: The wiki link rewrite still works
        run: |
          cp -a docs /tmp/wikicheck
          python3 tools/wiki_links.py /tmp/wikicheck
          if grep -rnoE '\]\([A-Za-z0-9_-]+\.md[)#]' /tmp/wikicheck; then
            echo "::error::links to .md files survived the rewrite"
            exit 1
          fi

      # Frame rate on this panel is bandwidth-bound, so the thing worth
      # guarding against regression is cache-line traffic per frame, not
      # wall-clock on a runner that shares nothing with an ESP32-S3.  The
      # ceiling is near the cost of a full-screen clear: a screen that exceeds
      # it is repainting everything, which is the mistake worth catching here
      # rather than on hardware.
      # Two ceilings, because a chrome-cached screen and a live plot have
      # nothing to do with each other and one number would guard neither.
      #
      # 15,600 is not a preference: the panel moves 976 KiB per frame at
      # 39 Hz, and a render costing twice that lands at 19.5 fps -- exactly
      # one frame per 20 Hz telemetry sample.  Above it the panel can no
      # longer deliver a frame per sample, which is the regression worth
      # catching.  2,000 catches a menu that has stopped caching its chrome.
      - name: The bench frame still fits one telemetry sample
        run: python3 tools/frame_cost.py frame sim --max-lines 15600

      - name: The chrome-cached screens have not started repainting
        run: python3 tools/frame_cost.py overview --max-lines 2000

      # The servo card draws its arm and grip from coverage, which is not
      # cheap; 17,000 catches that growing.  The grip figure is the one that
      # matters most: a breath repaints a clipped box and nothing else, and
      # 4,000 catches the day something bumps the revision on every poll and
      # quietly puts the whole card back in the frame.
      - name: The servo card is drawn, and its grip is only breathed on
        run: python3 tools/frame_cost.py servo --max-lines 17000
             && python3 tools/frame_cost.py servo-grip --max-lines 4000

      - name: The frame-cost table in the docs is current
        run: python3 tools/frame_cost.py --check-doc

      # The screens are rendered by the same code the panel runs, so a golden
      # image is a real check on what they look like -- not a substitute for
      # the unit tests, which cover what they decide.
      - name: The committed screenshots match the current render
        run: python3 tools/render_ui.py --check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: warn

  panel:
    name: Panel (ESP-IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v5.4 is the floor -- the RGB panel's on_frame_buf_complete event
        # landed there -- and it is built on purpose rather than only building
        # the newest.  The predecessor's components compile against a later
        # v5.4.x point release but not against v5.4.0, because they include
        # esp_timer.h without requiring it; that is precisely the class of
        # mistake a floor build catches.
        idf: [v5.4, v5.5]
    steps:
      - uses: actions/checkout@v6

      # No cache step: the build runs inside the espressif/idf container, so
      # ~/.espressif on the runner is never written or read and the cache was
      # a guaranteed miss on every run.
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: 'firmware/panel'
          # A single image flashable at 0x0, as well as the three parts.
          # Flashing bootloader, partition table and app at three offsets is
          # three chances to get an offset wrong; the merged one has none.
          command: idf.py build && idf.py merge-bin -o rcbench-panel-merged.bin

      - name: Size report
        run: |
          ls -l firmware/panel/build/*.bin firmware/panel/build/bootloader/bootloader.bin
          sha256sum firmware/panel/build/*.bin

      - uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.idf }}
          path: |
            firmware/panel/build/rcbench-panel-merged.bin
            firmware/panel/build/rcbench-panel.bin
            firmware/panel/build/rcbench-panel.elf
            firmware/panel/build/bootloader/bootloader.bin
            firmware/panel/build/partition_table/partition-table.bin
            firmware/panel/build/flash_args
          if-no-files-found: error

  iomcu:
    # The env context is not available in a job name -- only github,
    # needs, strategy, matrix, vars and inputs are -- so the pin is spelled
    # out here and lives for real in env.PICO_SDK_TAG below.
    name: Coprocessor (pico-sdk 2.3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Ubuntu's packaged toolchain rather than ARM's tarball, because it is
      # one line and the RP2350's Cortex-M33 is not exotic.  This is the one
      # step in this file that was not reproduced locally -- no sudo on the
      # machine it was written on -- so if it fails, the verified fallback is
      # ARM's own 14.2 release, unpacked and put on PATH.
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev

      # Pinned, and cached on the tag: the SDK is 400 MB of checkout and it
      # does not change between runs unless this pin does.
      - name: Cache the pico-sdk
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}

      - name: Clone the pico-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_TAG" --recursive \
            --shallow-submodules https://github.com/raspberrypi/pico-sdk.git

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware/iomcu -B firmware/iomcu/build -G Ninja
          cmake --build firmware/iomcu/build -j"$(nproc)"
          ls -l firmware/iomcu/build/rcbench-iomcu.uf2
          sha256sum firmware/iomcu/build/rcbench-iomcu.uf2

      - uses: actions/upload-artifact@v7
        with:
          name: iomcu
          path: |
            firmware/iomcu/build/rcbench-iomcu.uf2
            firmware/iomcu/build/rcbench-iomcu.elf
          if-no-files-found: error
