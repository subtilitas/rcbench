name: CI

on:
  push:
    branches: [main]
    # Tags too: a release builds from the tagged commit, which need not be on
    # main, and the host suite runs against it before firmware is published.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref, the newest: a push to a pull request cancels the run of
# the push before it.  A push to main is the exception and has a group of its
# own, so its run is never cancelled: docs.yml waits for the run on its
# commit, and a later push to main that does not touch docs/ starts no
# docs.yml run to publish in its place.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PICO_SDK_TAG: '2.3.0'

jobs:
  host-tests:
    name: Host suite, coverage and the checks that hold prose to the tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          # The runner image carries package lists this build never installs
          # from, and apt-get update fails the whole step when any one of them
          # serves a stale index (for example "Hash Sum mismatch" on
          # dl.google.com/linux/chrome-stable).  A toolchain install does not
          # depend on a browser's mirror, so those lists are removed first.
          #
          # Matched by glob rather than by name: the image writes these as
          # .list or as deb822 .sources depending on its version, and a name
          # that misses leaves the failure exactly as it was.  -v so the log
          # says what went, since a silent no-op here looks identical to a fix.
          sudo rm -fv /etc/apt/sources.list.d/*google* \
                      /etc/apt/sources.list.d/*microsoft* || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc fonts-dejavu-core valgrind
          python3 -m pip install pillow==12.3.0

      # test/host/check_wa_page.py hands the script of the browser page to
      # node and is skipped, not failed, when node is missing.  The runner
      # image carries node; this step fails the job if that changes.
      - name: Node for the page script check
        run: node --version

      - name: Unit tests
        run: |
          cmake -S test/host -B test/host/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build test/host/build -j"$(nproc)"
          ctest --test-dir test/host/build --output-on-failure

      # The same suite under AddressSanitizer and UBSan
      # (UndefinedBehaviorSanitizer), for the runtime faults the -Werror build
      # above cannot see: a parser reading off the end of a frame, a signed
      # shift overflowing, an unaligned access.  The parsers for CSV
      # (comma-separated values), CAN (Controller Area Network), OpenYGE and
      # S.BUS are fed malformed input by design.  A separate build directory
      # because the flags differ.
      # A test executable instrumented against uninstrumented libraries
      # builds and passes while checking almost nothing, so the flags are
      # proved to reach shared/ and protocols/ before the run that would
      # report success.
      - name: Sanitizers reach the code under test
        run: python3 tools/check_sanitizers.py --check

      - name: Unit tests under sanitizers
        run: |
          cmake -S test/host -B test/host/build-san -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON
          cmake --build test/host/build-san -j"$(nproc)"
          ctest --test-dir test/host/build-san --output-on-failure

      # Fails when the table in STATUS.md or the figure in README.md and
      # README-de.md does not match the measurement, rather than committing a
      # fixup, and when a source under shared/ or a core file under
      # protocols/ is not in the measurement.
      - name: Coverage is current
        run: python3 tools/coverage.py --check --json coverage.json

      # The floors above are the gate and run offline; this is the report.
      # Codecov annotates the diff in a pull request, so a change can be seen
      # to be tested rather than only measured in aggregate.  coverage.py
      # leaves an instrumented build behind, so nothing is rebuilt.
      - name: Coverage report for Codecov
        run: |
          pipx install gcovr==8.6 || python3 -m pip install --quiet gcovr==8.6
          gcovr --root . --filter 'shared/' --filter 'protocols/' \
                --exclude '.*font.*' \
                --cobertura coverage.xml --print-summary

      # A failed upload fails the job: the badge in the README is Codecov's,
      # and an upload that fails quietly leaves it at an older commit's
      # figure under a green build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true

      - name: The checked-in fonts match their generator
        run: python3 tools/gen_font.py --check

      # The board drawings the IOmcu serves are generated from the
      # configurator's panel drawing and checked in, so the firmware build
      # needs no Python and no Node.js.
      - name: The checked-in board drawings match the configurator's
        run: python3 tools/gen_board_drawing.py --check

      # The ESC programming profiles are JSON; the panel carries them as C
      # tables generated from that JSON and checked in.
      - name: The checked-in ESC profile tables match their JSON
        run: python3 tools/gen_esc_profiles.py --check

      # Every file over 1,000 lines is in tools/check_sizes.txt with the
      # reason it stays whole, and no listed file is at or under 1,000.
      # Generated files are the generators' above.
      - name: The files over 1,000 lines are the listed ones
        run: python3 tools/check_sizes.py --check

      # Links, anchors, the sidebar, the translations, the list of test
      # binaries, the module tree and the compile table.
      - name: The docs agree with the tree
        run: python3 tools/check_docs.py

      # The web help: every screen has a page in English and German, every
      # screenshot it shows exists in render_ui.py and in docs/img/, the two
      # languages of a page have the same headings and screenshots, every
      # link between pages lands, and the Markdown stays inside the subset
      # of help/site/FORMAT.md.
      - name: The web help covers every screen
        run: python3 tools/help_site.py --check

      # A module under protocols/ is built in other pico-sdk projects, C
      # and C++, without the rest of this tree: no include leaves the
      # module, and every public header compiles alone as C11 and as C++17.
      - name: The protocol modules stand alone
        run: python3 tools/check_protocols.py --check

      # The parser table in SECURITY.md against the parse functions in the
      # public headers.
      - name: SECURITY.md lists the parsers
        run: python3 tools/security_parsers.py --check

      # The wiki gets these pages with their links translated, and a broken
      # translator shows up only as a wiki full of downloads.  Run it against
      # a copy so a mistake fails here rather than there.
      - name: The wiki link rewrite still works
        run: |
          python3 -m pip install --quiet markdown-it-py==3.0.0
          cp -a docs /tmp/wikicheck
          python3 tools/wiki_links.py /tmp/wikicheck
          python3 tools/wiki_links.py --verify /tmp/wikicheck

      # Frame rate on this panel is bandwidth-bound, so the regression guard
      # is cache-line traffic per frame, not wall-clock on a runner that
      # shares nothing with an ESP32-S3.  Two ceilings, because a
      # chrome-cached screen and a live plot are unrelated.
      #
      # 15,600: the panel moves 976 KiB per frame at 39 Hz, and a render
      # costing twice that lands at 19.5 fps, one frame per 20 Hz telemetry
      # sample.  Above it the panel cannot deliver a frame per sample.
      # 2,000 catches a menu that has stopped caching its chrome.
      - name: The bench frame still fits one telemetry sample
        run: python3 tools/frame_cost.py frame sim supply --max-lines 15600

      - name: The chrome-cached screens have not started repainting
        run: python3 tools/frame_cost.py overview --max-lines 2000

      # The servo card draws its arm and grip from coverage; 17,000 catches
      # that growing.  A breath repaints a clipped box and nothing else, and
      # 4,000 catches a revision bump on every poll that puts the whole card
      # back in the frame.  A window of the INA3221 in every frame repaints
      # the CURRENT row's value, the line and the plot beside the grip, each
      # clipped; 4,500 catches a changed digit that repaints the card.
      - name: The servo card is drawn, and its grip is only breathed on
        run: python3 tools/frame_cost.py servo --max-lines 17000
             && python3 tools/frame_cost.py servo-grip --max-lines 4000
             && python3 tools/frame_cost.py servo-current --max-lines 4500

      # Every screen caches its chrome, so a steady frame is a few hundred
      # fills; 1,200 catches one that has started repainting.  The watermark
      # blends over the whole canvas and costs about 1,355 on top of that.
      - name: Every screen still idles on a cached frame
        run: python3 tools/frame_cost.py analyser logs settings battery balance
             motor-stick picker wifi --max-lines 1200
             && python3 tools/frame_cost.py settings-list --max-lines 1200

      - name: The SIMULATION watermark has not grown
        run: python3 tools/frame_cost.py balance-sim settings-sim battery-sim
             --max-lines 2800

      # A theme change or a change of the SIMULATED flag invalidates every
      # screen, which costs one full repaint.  45,000 catches that growing.
      - name: A full repaint of every screen stays bounded
        run: python3 tools/frame_cost.py analyser-chrome balance-chrome
             battery-chrome motor-stick-chrome logs-chrome settings-chrome
             settings-list-chrome picker-chrome supply-chrome wifi-chrome
             --max-lines 45000

      # A key typed on the Wi-Fi keyboard repaints the whole WI-FI
      # screen, about 21,900 fills; 24,000 catches a key that repaints more.
      - name: A key of the Wi-Fi keyboard costs one repaint
        run: python3 tools/frame_cost.py wifi-keys --max-lines 24000

      - name: The frame-cost table in the docs is current
        run: python3 tools/frame_cost.py --check-doc

      # The screens are rendered by the code the panel runs, so a golden image
      # checks what they look like; the unit tests cover what they decide.
      - name: The committed screenshots match the current render
        run: python3 tools/render_ui.py --check

      # A string longer than its field is cut or runs into its neighbour;
      # this draws every view in both languages and measures.  The English
      # overflows the layout has are listed by name in the tool and printed;
      # any other fails, in either language.
      - name: Every string fits where it is drawn
        run: python3 tools/render_ui.py --fit

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: warn

  analysis:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # cppcheck is built from the official source archive of this tag;
      # tools/install_cppcheck.sh stops when the SHA-256 differs.
      CPPCHECK_VERSION: 2.17.1
      CPPCHECK_SHA256: bfd681868248ec03855ca7c2aea7bcb1f39b8b18860d76aec805a92a967b966c
    steps:
      - uses: actions/checkout@v6

      # The build is cached on the version and the hash; a hit builds nothing.
      - name: Restore cppcheck
        id: cppcheck-cache
        uses: actions/cache@v6
        with:
          path: ~/cppcheck-${{ env.CPPCHECK_VERSION }}
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ env.CPPCHECK_SHA256 }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the analysers
        run: |
          # Third-party lists this build never installs from; one serving a
          # stale index fails the whole step.  See the note in the host job.
          sudo rm -fv /etc/apt/sources.list.d/*google* \
                      /etc/apt/sources.list.d/*microsoft* || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-tidy
          python3 -m pip install --quiet ruff==0.16.5

      - name: Build cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          tools/install_cppcheck.sh "$CPPCHECK_VERSION" "$CPPCHECK_SHA256" \
            "$HOME/cppcheck-$CPPCHECK_VERSION"

      # The distribution's cppcheck is 2.13; the version check fails the
      # step when the build is not the pinned one.
      - name: Put cppcheck on the path
        run: |
          echo "$HOME/cppcheck-$CPPCHECK_VERSION/bin" >> "$GITHUB_PATH"
          "$HOME/cppcheck-$CPPCHECK_VERSION/bin/cppcheck" --version \
            | grep -qx "Cppcheck $CPPCHECK_VERSION"

      # clang-tidy needs to know how each file is compiled, and CMake can say.
      - name: Describe the build
        run: |
          cmake -S test/host -B test/host/build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # The analyser and the bug-shaped checks over the pure-C core, the
      # protocol cores and the host tests.  A module's rp2350/ folder is not
      # in the host build; cppcheck reads it with the firmware below.
      # render_screen.c and bench_frame.c are built by tools/render_ui.py and
      # tools/frame_cost.py, not by CMake, so they have no compile command
      # here; render_ui.py builds the first with -Werror, cppcheck reads both.
      # Configuration and the reason for each disabled check are in
      # .clang-tidy and test/host/.clang-tidy.
      - name: clang-tidy
        run: |
          git ls-files 'shared/**/*.c' 'protocols/**/*.c' 'test/host/*.c' \
                       'testbench/touch-injector/core/*.c' \
              | grep -v -e 'gfx_font' -e '/rp2350/' \
                        -e 'test/host/render_screen.c' \
                        -e 'test/host/bench_frame.c' \
              | xargs -P "$(nproc)" -n 4 clang-tidy -p test/host/build --quiet

      # cppcheck sees different things: it is weaker on flow and better at
      # arithmetic and at the shapes that look wrong on their own.
      # A build directory keeps the whole-program checks under -j, which
      # cppcheck drops without one; settings_rig.h includes iomcu_pins.h.
      - name: cppcheck
        run: |
          mkdir -p "$RUNNER_TEMP/cppcheck"
          cppcheck -j "$(nproc)" --error-exitcode=1 --std=c11 --quiet \
            --cppcheck-build-dir="$RUNNER_TEMP/cppcheck" \
            --enable=warning,style,performance,portability \
            --inline-suppr --suppressions-list=.cppcheck-suppress \
            --check-level=exhaustive -Itest/host -Ifirmware/iomcu/include \
            $(git ls-files 'shared/**/include/*' \
                | sed 's|/include/.*|/include|; s|^|-I|' | sort -u) \
            $(git ls-files 'protocols/**/include/*' \
                | sed 's|/include/.*|/include|; s|^|-I|' | sort -u) \
            -Itestbench/touch-injector/core/include \
            $(git ls-files 'shared/**/*.c' 'protocols/**/*.c' \
                'testbench/touch-injector/core/*.c' \
                | grep -v -e 'gfx_font' -e '/rp2350/') \
            $(git ls-files 'test/host/*.c')

      # The firmware and the pin drivers under protocols/*/rp2350 are
      # hardware access and wiring, and cppcheck reads them
      # without the vendor SDKs (software development kits): a header it
      # cannot find is skipped.  The bug-shaped classes run; the style class
      # does not, and clang-tidy does not run over firmware/ at all, because
      # it compiles each file and needs every ESP-IDF and pico-sdk header to
      # do it.  The panel's main.c is checked on its own with the main task's
      # stack size defined: it refuses to compile under 8192.
      - name: cppcheck over the firmware
        run: |
          cppcheck --error-exitcode=1 --std=c11 --quiet \
            --enable=warning,performance,portability \
            --inline-suppr --suppressions-list=.cppcheck-suppress \
            --check-level=exhaustive \
            $(git ls-files 'shared/**/include/*' 'protocols/**/include/*' \
                'firmware/**/include/*' \
                | sed 's|/include/.*|/include|; s|^|-I|' | sort -u) \
            $(git ls-files 'protocols/*/rp2350/*.h' \
                | sed 's|/[^/]*$||; s|^|-I|' | sort -u) \
            -Ifirmware/iomcu/src -Ifirmware/panel/main \
            -Itestbench/touch-injector/core/include \
            $(git ls-files 'firmware/**/*.c' 'protocols/*/rp2350/*.c' \
                'testbench/touch-injector/rp2350/*.c' \
                | grep -v '^firmware/panel/main/main\.c$')
          cppcheck --error-exitcode=1 --std=c11 --quiet \
            --enable=warning,performance,portability \
            --inline-suppr --suppressions-list=.cppcheck-suppress \
            --check-level=exhaustive \
            -DCONFIG_ESP_MAIN_TASK_STACK_SIZE=8192 \
            $(git ls-files 'shared/**/include/*' 'protocols/**/include/*' \
                'firmware/**/include/*' \
                | sed 's|/include/.*|/include|; s|^|-I|' | sort -u) \
            -Ifirmware/panel/main \
            firmware/panel/main/main.c

      # A translated format reaches snprintf() through a table lookup, which
      # -Wformat cannot see; this compiles shared/ again with the English
      # literals in place and fails on any format warning.
      - name: Every translated format matches its call
        run: python3 tools/check_formats.py

      # The tools in tools/ are held to the same standard as the C: each of
      # them can fail a build, so a bug in one is a bug in the gate.  Their
      # tests are held to it too, and the script of the host suite.
      - name: ruff
        run: ruff check tools/ test/tools/ test/host/

  tools:
    name: Tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # The runner image carries git, cmake and a C compiler, which the
      # end-to-end cases of the mutation tool build a three-file project
      # with; a case skips when one is missing.
      - name: Install pytest
        run: python3 -m pip install --quiet pytest==9.1.1 markdown-it-py==3.0.0

      # The checks are a gate, so each rule of a check has a case that
      # breaks it: a flag taken out of the sanitizer build, a source left
      # out of the coverage measurement, a number in a page that differs
      # from its constant, an overflow that is not a known one.
      - name: pytest
        run: python3 -m pytest test/tools -q

  # What the suite does not notice in the lines a pull request changes.  It
  # reports and does not fail on a survivor: the job fails only when the
  # tool cannot run.  The run is bounded at 2700 s by the tool's defaults.
  mutation:
    name: Mutation check of the changed lines (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # The base branch has to be here to diff against.
          fetch-depth: 0

      - name: Mutate the changed lines of shared/ and protocols/
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          python3 tools/mutate.py --base "$BASE" --json mutation.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation
          path: mutation.json
          if-no-files-found: warn

  panel:
    name: Panel (ESP-IDF ${{ matrix.idf }})
    # The v5.4 build carries the IOmcu image of this commit, as the
    # release does; the v5.5.3 build carries none, as a build without the
    # option does.
    needs: [iomcu]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # v5.4 is the floor: the RGB (parallel red-green-blue) panel's
        # on_frame_buf_complete event exists from v5.4.  The floor is built as
        # well as the newest release, because a component that includes
        # esp_timer.h without requiring it compiles on a later v5.4.x point
        # release and not on v5.4.0.  v5.5.0 and v5.5.1 send a DLC 0 frame
        # as DLC 8 and are refused by can_twai.c, so the newer entry names
        # its point release.
        idf: [v5.4, v5.5.3]
        include:
          - idf: v5.4
            image: true
    steps:
      - uses: actions/checkout@v6

      # Inside firmware/panel, the directory the build runs in, so the
      # container sees it under the same relative path.
      - name: Fetch the IOmcu image
        if: matrix.image
        uses: actions/download-artifact@v7
        with:
          name: iomcu
          path: firmware/panel/iomcu-image

      # No cache step: the build runs inside the espressif/idf container, so
      # ~/.espressif on the runner is never written or read and a cache would
      # never hit.
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: 'firmware/panel'
          # A single image flashable at 0x0, as well as the three parts.
          # Flashing bootloader, partition table and app at three offsets is
          # three chances to get an offset wrong; the merged one has none.
          command: >-
            idf.py ${{ matrix.image && '-D RCBENCH_IOMCU_BIN=iomcu-image/rcbench-iomcu.bin' || '' }} build
            && idf.py merge-bin -o rcbench-panel-merged.bin

      - name: Size report
        run: |
          ls -l firmware/panel/build/*.bin firmware/panel/build/bootloader/bootloader.bin
          sha256sum firmware/panel/build/*.bin

      # The symbol target_add_binary_data() names the embedded image by:
      # present in the build with the image, absent in the one without.
      - name: The IOmcu image is carried only when asked for
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if grep -aq _binary_rcbench_iomcu_bin_start \
              firmware/panel/build/rcbench-panel.elf; then
            carried=true
          else
            carried=false
          fi
          echo "carries the IOmcu image: $carried"
          [ "$carried" = "${IMAGE:-false}" ]

      # Every task's deepest call chain, read out of the ELF, against its
      # stack less a 1024-byte margin.  The UI runs on the main task, and a
      # chain past its end restarts the panel.  Needs only Python: the tool
      # decodes the instructions itself.  On both matrix entries, because
      # each ESP-IDF release brings its own toolchain and its own frames.
      - name: Every task's stack holds its deepest call chain
        run: python3 tools/stack_check.py firmware/panel/build

      # The table in docs/Performance.md is measured on ESP-IDF v5.4, so it
      # is held to that build and not to the other.
      - name: The stack table in the docs is this build's
        if: matrix.idf == 'v5.4'
        run: python3 tools/stack_check.py firmware/panel/build --check-doc

      # The internal heap the build leaves, less every task stack, queue
      # and buffer the panel allocates at run time and what the largest
      # Wi-Fi mode allocates on top, against a floor of 32768 bytes.  The
      # Wi-Fi driver takes 51,200 bytes of DMA-capable internal RAM at
      # esp_wifi_init(), and a panel short of it refuses ACCESS POINT at
      # once.  On both matrix entries; the table in the docs is the v5.4
      # build's.
      - name: Internal RAM holds the largest Wi-Fi mode
        run: python3 tools/ram_budget.py firmware/panel/build
             ${{ matrix.idf == 'v5.4' && '--check-doc' || '' }}

      # The default build reads a touch injector at 0x14 beside the glass
      # (testbench/touch-injector).  The image must hold its code, INJECT's
      # mode name and one literal of INJECT's bubble text
      # (shared/ui/include/ui_text.def).
      - name: The default image holds the touch injector
        run: |
          for s in touch_inject_attach ui_band_mode_inject \
              "the injector at I2C address 0x14"; do
            if ! grep -aqF "$s" firmware/panel/build/rcbench-panel.elf; then
              echo "::error::the default image lacks touch injector code: $s"
              exit 1
            fi
          done

      # FatFs with exFAT (firmware/panel/fatfs_exfat.cmake): ff.c's
      # check_fs() compares a boot sector with "EXFAT   " only when
      # FF_FS_EXFAT is 1, and the string is in no image without it.
      - name: The image mounts exFAT
        run: |
          if ! grep -aqF 'EXFAT   ' firmware/panel/build/rcbench-panel.elf; then
            echo "::error::the panel image is built without exFAT"
            exit 1
          fi

      # The build without it, so the option keeps building: the image
      # must hold none of that code.  Not uploaded.
      - name: The build without the injector compiles
        if: matrix.idf == 'v5.4'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: 'firmware/panel'
          command: idf.py -B build-noinject -D RCBENCH_TOUCH_INJECTOR=OFF build

      - name: The injector code is not in the build without it
        if: matrix.idf == 'v5.4'
        run: |
          if grep -aqF -e touch_inject_ -e touch_merge_ \
              -e ui_band_mode_inject \
              -e "the injector at I2C address 0x14" \
              firmware/panel/build-noinject/rcbench-panel.elf; then
            echo "::error::the build without the injector holds its code"
            exit 1
          fi
          python3 tools/stack_check.py firmware/panel/build-noinject
          python3 tools/ram_budget.py firmware/panel/build-noinject

      - uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.idf }}
          path: |
            firmware/panel/build/rcbench-panel-merged.bin
            firmware/panel/build/rcbench-panel.bin
            firmware/panel/build/rcbench-panel.elf
            firmware/panel/build/bootloader/bootloader.bin
            firmware/panel/build/partition_table/partition-table.bin
            firmware/panel/build/ota_data_initial.bin
            firmware/panel/build/flash_args
          if-no-files-found: error

  iomcu:
    # The env context is not available in a job name (only github, needs,
    # strategy, matrix, vars and inputs are), so the pin is spelled out here
    # and lives in env.PICO_SDK_TAG below.
    name: IOmcu (pico-sdk 2.3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # The .deb files are cached because the Azure mirror serves at about
      # 50 kB/s at times: gcc-arm-none-eabi (57.5 MB) took 19 min on one run.
      # The key carries the runner image version, so a new image saves a fresh
      # entry that starts from the previous one.
      - name: Key for the toolchain packages
        id: arm-keys
        run: tools/install_arm_toolchain.sh cache-keys >> "$GITHUB_OUTPUT"

      - name: Cache the toolchain packages
        uses: actions/cache@v6
        with:
          path: ~/apt-arm/*.deb
          key: ${{ steps.arm-keys.outputs.key }}
          restore-keys: ${{ steps.arm-keys.outputs.restore }}

      # Ubuntu's packaged toolchain rather than ARM's tarball: one line, and
      # the RP2350's Cortex-M33 needs nothing newer.  Fallback if the package
      # fails: ARM's 14.2 release, unpacked and put on PATH.
      - name: Install the ARM toolchain
        run: tools/install_arm_toolchain.sh install "$HOME/apt-arm"

      # Pinned, and cached on the tag: the SDK (software development kit) is
      # 400 MB of checkout and does not change between runs unless this pin
      # does.
      - name: Cache the pico-sdk
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}

      - name: Clone the pico-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_TAG" --recursive \
            --shallow-submodules https://github.com/raspberrypi/pico-sdk.git

      # The IO board's draft pin map against the functions the RP2350 has on
      # each pin, read from the SDK's io_bank0.h.  Here because this job has
      # the SDK.
      - name: The pin map asks nothing the RP2350 cannot do
        run: python3 tools/pinmap_check.py hardware/docs/ioboard-pinmap-draft.json
             --sdk pico-sdk

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware/iomcu -B firmware/iomcu/build -G Ninja
          cmake --build firmware/iomcu/build -j"$(nproc)"
          ls -l firmware/iomcu/build/rcbench-iomcu.uf2 \
                firmware/iomcu/build/rcbench-iomcu-install.uf2
          sha256sum firmware/iomcu/build/rcbench-iomcu.uf2 \
                    firmware/iomcu/build/rcbench-iomcu-install.uf2

      # Core 0 runs main() on 4096 bytes with no guard under them, and an
      # interrupt lands on the same stack.  Read out of the ELF: each core's
      # deepest call chain, one interrupt, and 256 bytes, against its stack;
      # and core 0's row in docs/Performance.md against this build.
      - name: Each core's stack holds its deepest call chain and an interrupt
        run: python3 tools/stack_check.py --iomcu firmware/iomcu/build
             --check-doc

      # The debug build that prints INA3221 CH1's samples is not released,
      # and nothing else compiles its firmware side: built here so it keeps
      # building, under the target's -Werror, with its two stacks checked
      # as the released image's are.  The image above must hold none of it.
      - name: The trace build compiles, and the released image has no trace
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware/iomcu -B firmware/iomcu/build-trace -G Ninja \
            -DSENSE_TRACE=ON
          cmake --build firmware/iomcu/build-trace -j"$(nproc)"
          arm-none-eabi-nm firmware/iomcu/build-trace/rcbench-iomcu.elf \
            | grep -q sense_trace_feed
          if arm-none-eabi-nm firmware/iomcu/build/rcbench-iomcu.elf \
              | grep -i sense_trace; then
            echo "::error::the default image holds trace code"
            exit 1
          fi
          python3 tools/stack_check.py --iomcu firmware/iomcu/build-trace

      # The bench console (docs/BenchConsole.md) is not released either: built
      # here so it keeps building, with its two stacks checked.  The default
      # image must hold none of it.
      - name: The console build compiles, and the released image has no console
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware/iomcu -B firmware/iomcu/build-console -G Ninja \
            -DIOMCU_CONSOLE=ON
          cmake --build firmware/iomcu/build-console -j"$(nproc)"
          arm-none-eabi-nm firmware/iomcu/build-console/rcbench-iomcu.elf \
            | grep -q page_console_key
          if arm-none-eabi-nm firmware/iomcu/build/rcbench-iomcu.elf \
              | grep -iE 'page_console|console_hw'; then
            echo "::error::the default image holds console code"
            exit 1
          fi
          python3 tools/stack_check.py --iomcu firmware/iomcu/build-console

      - uses: actions/upload-artifact@v7
        with:
          name: iomcu
          path: |
            firmware/iomcu/build/rcbench-iomcu.uf2
            firmware/iomcu/build/rcbench-iomcu-install.uf2
            firmware/iomcu/build/rcbench-iomcu-pt.uf2
            firmware/iomcu/build/rcbench-iomcu.bin
            firmware/iomcu/build/rcbench-iomcu.elf
          if-no-files-found: error

  touch-injector:
    # A test-bench tool (testbench/touch-injector), built so it keeps
    # building.  Its UF2 is not uploaded and no release carries it.
    name: Touch injector (pico-sdk 2.3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # The .deb files are cached because the Azure mirror serves at about
      # 50 kB/s at times: gcc-arm-none-eabi (57.5 MB) took 19 min on one run.
      # The key carries the runner image version, so a new image saves a fresh
      # entry that starts from the previous one.
      - name: Key for the toolchain packages
        id: arm-keys
        run: tools/install_arm_toolchain.sh cache-keys >> "$GITHUB_OUTPUT"

      - name: Cache the toolchain packages
        uses: actions/cache@v6
        with:
          path: ~/apt-arm/*.deb
          key: ${{ steps.arm-keys.outputs.key }}
          restore-keys: ${{ steps.arm-keys.outputs.restore }}

      - name: Install the ARM toolchain
        run: tools/install_arm_toolchain.sh install "$HOME/apt-arm"

      # The same key as the IOmcu job: one SDK checkout for both.
      - name: Cache the pico-sdk
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}

      - name: Clone the pico-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_TAG" --recursive \
            --shallow-submodules https://github.com/raspberrypi/pico-sdk.git

      # From its own directory with PICO_SDK_PATH alone, as the README
      # builds it.
      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        working-directory: testbench/touch-injector
        run: |
          cmake -S . -B build -G Ninja -DPICO_BOARD=waveshare_rp2350_zero
          cmake --build build -j"$(nproc)"
          ls -l build/rcbench-touch-injector.uf2
          sha256sum build/rcbench-touch-injector.uf2
