name: Mutation

# The mutants of every line of shared/safety and shared/outputs, once a week.
# The per-pull-request run in ci.yml covers the changed lines and stops at 60
# mutants; this run has no mutant limit.  tools/mutate.py orders the list
# with shared/safety first (arming.c, heartbeat.c, stop_latch.c,
# touch_loss.c and prog5v_lost.c at its head, then the rest of the folder),
# then shared/outputs, and shard i of 6 takes the mutants at the places i,
# i + 6, i + 12 and so on.  A shard starts no mutant after 18000s: at 42s a
# mutant on the runner that is about 428 mutants a shard, 2,568 of the
# 6,743 in all.  Every mutant of shared/safety (699, about 117 a shard) runs every
# week; of shared/outputs the head of the list runs and the rest does not.
# A shard that leaves mutants unrun says so: a warning annotation, and in
# its summary the count and a table of the files.  The run reports and does
# not fail on a survivor or on mutants left: the job fails only when the
# tool cannot run.  Start by hand with "Run workflow".
# tools/check_mutants.py --check (ci.yml) holds the figures above to the
# tree; --update writes them.

on:
  schedule:
    - cron: '17 3 * * 0'   # Sunday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full mutation run, shard ${{ matrix.shard }} of 6
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-26.04
    # budget 18000s + 5 timeouts of 600s = 21000s, plus checkout.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Mutate this shard's share, shared/safety first
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          find shared/safety shared/outputs -name '*.c' -o -name '*.h' \
            | sort > "$RUNNER_TEMP/files"
          xargs -a "$RUNNER_TEMP/files" python3 tools/mutate.py \
            --first shared/safety/arming.c shared/safety/heartbeat.c \
            shared/safety/stop_latch.c shared/safety/touch_loss.c \
            shared/safety/prog5v_lost.c shared/safety/ \
            --shard "$SHARD/6" --max-mutants 0 \
            --budget 18000 --timeout 600 \
            --json "mutation-full-$SHARD.json" \
            --summary "$GITHUB_STEP_SUMMARY" --files

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-full-${{ matrix.shard }}
          path: mutation-full-${{ matrix.shard }}.json
          if-no-files-found: warn
