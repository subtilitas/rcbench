name: Testbench sigrok

# Builds libsigrok and sigrok-cli from git for the bench Raspberry Pi 5, and
# fails the run if the result cannot drive the Kingst LA2016.
#
# Debian 13 (trixie) packages libsigrok 0.5.2, which has no kingst-la2016
# driver.  src/hardware/kingst-la2016 does not exist at the libsigrok-0.5.2
# tag, whose commit carries committer date 2019-12-25; the directory's oldest
# commit, f2cd2deb, carries author date 2020-03-21 and committer date
# 2020-06-06.  No release tag contains the driver.  The analyser on the bench
# needs a build from master.  A build on the Pi takes hours, so it happens
# here.
#
# The build runs in a debian:trixie container on the arm64 runner because the
# tarball has to match Debian 13 arm64's application binary interface (ABI).
# The runner image is Ubuntu 24.04; binaries linked there resolve a different
# C library and a different glib than the Pi loads.  Inside the container the
# compiler, the headers and the libraries are Debian 13's; only the kernel
# comes from the host.
#
# Two jobs.  "build" produces the tarball.  "verify" unpacks that tarball in a
# container holding no -dev package and no sigrok package, installs only the
# runtime closure the tarball records, and runs the binary there.  The build
# job proves the build; the verify job answers whether the artifact runs on a
# machine that never compiled it.
#
# What the artifact does not carry: the FX2 microcontroller firmware
# (kingst-la-01a2.fw) and the FPGA (field-programmable gate array) bitstreams
# the driver uploads to the analyser at scan time.  Both are Kingst material
# extracted from the vendor software, with no redistribution grant, and this
# repository is public.  The tarball carries a note stating where they go on
# the Pi and what the documented extraction produces.

on:
  workflow_dispatch:
    inputs:
      libsigrok_ref:
        # A commit rather than a branch: master carries no release tag and no
        # ABI promise, and its libtool triple is 4:0:0 while released 0.5.2 is
        # 5:1:1, so no version string orders the two.  Two builds of "master"
        # can differ in the measurement path with nothing visible moving.
        # This default is the GitHub mirror's master HEAD as read from the
        # GitHub API on 2026-09-09; the commit's own dates go into the
        # manifest, read from the clone.
        description: 'libsigrok commit, tag or branch'
        required: false
        default: '0bc2487778e660f4d3116729b6f4aee2b1996bb0'
        type: string
      sigrok_cli_ref:
        # Mirror master HEAD as read on 2026-09-09, pinned for the same reason.
        description: 'sigrok-cli commit, tag or branch'
        required: false
        default: 'f44dd91347e7ac797cefc23162b9fcf0b7329f1f'
        type: string

permissions:
  contents: read

defaults:
  run:
    # A run step in a container gets sh unless told otherwise, and the scripts
    # below use pipefail, arrays and bash test syntax.
    shell: bash

env:
  # /opt/sigrok, not /usr/local: Debian's libsigrok4t64 (0.5.2-5.1) and this
  # build both carry soname libsigrok.so.4.  With both on the default search
  # path the loader picks by path order and neither reports a mismatch, so a
  # Pi with the Debian package would run 0.5.2 and find no LA2016.  Under
  # /opt, with a runpath in sigrok-cli, the two cannot meet, and any Debian
  # sigrok package on the Pi keeps working.
  PREFIX: /opt/sigrok
  # The staged copy that becomes the tarball.  Kept outside the workspace so
  # nothing but the tarball reaches the upload step.
  STAGE: /tmp/stage
  TARBALL: sigrok-kingst-la2016-debian13-arm64.tar.gz

jobs:
  build:
    name: libsigrok and sigrok-cli for Debian 13 arm64
    runs-on: ubuntu-24.04-arm
    # Pinned by the digest of the multi-architecture index for debian:trixie,
    # resolved from registry-1.docker.io on 2026-09-09.  The tag alone floats
    # across point releases, so two runs of the same source commits would link
    # against different package versions with nothing recording which.  The
    # index digest, not a per-architecture manifest digest, so the runner still
    # selects arm64.  To refresh:
    #   tok=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/debian:pull" \
    #         | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
    #   curl -sI -H "Authorization: Bearer $tok" \
    #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
    #     https://registry-1.docker.io/v2/library/debian/manifests/trixie \
    #     | grep -i docker-content-digest
    # The verify job below pins the same digest and the two have to match.
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 60
    outputs:
      libsigrok_sha: ${{ steps.clone.outputs.libsigrok_sha }}

    steps:
      # The image carries neither git nor ca-certificates, so the clone needs
      # them installed first.  The container runs as root and has no sudo.
      #
      # This list is the minimum for the kingst-la2016 driver, which needs
      # libusb and nothing else; glib and libzip are unconditional for
      # libsigrok.  Every optional -dev package configure finds is appended to
      # Requires.private in libsigrok.pc and becomes one more shared library
      # the Pi must have, so the list is deliberate rather than generous.
      # g++ comes from build-essential and is required even with
      # --disable-bindings, because configure.ac calls AC_PROG_CXX outside any
      # conditional.  autoconf-archive supplies AX_CXX_COMPILE_STDCXX, which
      # autoreconf expands whether or not the conditional around it is taken.
      #
      # libsigrokdecode-dev (0.5.3-4 in trixie) is here so the binary can run
      # protocol decoders (sigrok-cli -P).  Its Depends are libglib2.0-dev,
      # libsigrokdecode4 and python3-dev, not libsigrok, so it drags no second
      # libsigrok into this container.  Drop it, and drop
      # --with-libsigrokdecode below, for a capture-only binary with a smaller
      # runtime set.
      #
      # The architecture gate is the only evidence in the run that the tarball
      # deserves its name.  runs-on names an arm64 runner and the pinned index
      # selects an arm64 manifest, but neither is checked anywhere else, and an
      # amd64 build passes every other assertion in this file and fails on the
      # Pi with "cannot execute binary file: Exec format error".
      - name: Install build dependencies
        run: |
          set -euo pipefail
          arch=$(dpkg --print-architecture)
          if [ "$arch" != arm64 ]; then
            echo "container architecture is $arch, not arm64" >&2
            exit 1
          fi
          echo "container architecture: $arch"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates \
            autoconf automake libtool pkg-config autoconf-archive \
            libglib2.0-dev libzip-dev zlib1g-dev libusb-1.0-0-dev \
            libsigrokdecode-dev

      # The GitHub mirrors over HTTPS rather than git://sigrok.org, which is
      # the canonical remote: plain git speaks TCP port 9418 with no transport
      # security, and whether the runner's egress permits that port is
      # untested.  The mirrors served the same HEAD as the canonical remotes on
      # 2026-09-09.
      #
      # Full clones, not --depth 1: the build stamps a version string from git,
      # and a ref given as a branch name needs the history behind it.
      #
      # safe.directory because the version stamp fails soft.  m4/sigrok.m4 asks
      # git for the short hash and records an empty suffix when the command
      # fails for any reason, ownership included, so the library then reports a
      # bare 0.6.0 and the build loses its provenance without an error.  The
      # assertion further down catches that; this makes it not happen.
      - name: Clone libsigrok and sigrok-cli
        id: clone
        env:
          LIBSIGROK_REF: ${{ inputs.libsigrok_ref }}
          SIGROK_CLI_REF: ${{ inputs.sigrok_cli_ref }}
        run: |
          set -euo pipefail
          # A dispatch input reaches this script through the environment, so it
          # is data and never part of the script text.  The allowlist rejects
          # two classes: a value holding a character git would not see as part
          # of a ref, and a value starting with a hyphen, which git would read
          # as an option rather than as a ref.
          for ref in "$LIBSIGROK_REF" "$SIGROK_CLI_REF"; do
            case "$ref" in
              ''|-*|*[!A-Za-z0-9._/-]*)
                echo "ref is empty, starts with a hyphen, or holds characters outside [A-Za-z0-9._/-]: $ref" >&2
                exit 1 ;;
            esac
          done
          git config --global --add safe.directory '*'
          mkdir -p src
          # The ref is resolved to a commit before HEAD is detached.  A fresh
          # clone carries one local branch and exposes every other as
          # origin/<name> only, and `git checkout --detach <name>` on one of
          # those does not fall back to the remote-tracking ref: git's guess
          # for a missing local branch is equivalent to `checkout -b --track`,
          # which --detach refuses.  It exits with
          #   fatal: '--detach' cannot be used with '-b/-B/--orphan'
          # so a branch name -- which the input description permits -- fails
          # where a commit or a tag works.  Trying the ref first and
          # origin/<ref> second takes commits, tags, and branch names alike.
          detach() {
            local dir=$1 ref=$2 sha
            sha=$(git -C "$dir" rev-parse --verify --quiet "${ref}^{commit}") \
              || sha=$(git -C "$dir" rev-parse --verify --quiet "origin/${ref}^{commit}") \
              || { echo "$dir: no commit, tag or branch named $ref" >&2; return 1; }
            git -C "$dir" checkout --detach "$sha"
          }
          git clone https://github.com/sigrokproject/libsigrok.git src/libsigrok
          detach src/libsigrok "$LIBSIGROK_REF"
          git clone https://github.com/sigrokproject/sigrok-cli.git src/sigrok-cli
          detach src/sigrok-cli "$SIGROK_CLI_REF"
          echo "libsigrok_sha=$(git -C src/libsigrok rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # --enable-kingst-la2016 explicitly: the default is enable_all_drivers=
      # check, under which configure.ac's _SR_DRIVER macro records
      # "kingst-la2016 no (missing: libusb)" in the summary and the build
      # succeeds without the driver.  With the flag the same macro takes the
      # AC_MSG_ERROR branch instead.
      #
      # --disable-bindings switches off the C++, Python, Ruby and Java bindings
      # in one flag.  The bench drives sigrok-cli over SSH (secure shell) and
      # nothing on it imports libsigrok, so the bindings would only add
      # glibmm, swig, a Java compiler and doxygen to the runtime set.
      #
      # Two installs: one into the real prefix, because sigrok-cli links
      # against it and the assertions run the installed binary; one into the
      # staging tree, which is what gets packaged.  `make dist` is never used,
      # because check-news in AM_INIT_AUTOMAKE fails it on an unreleased NEWS.
      - name: Build and install libsigrok
        run: |
          set -euo pipefail
          cd src/libsigrok
          ./autogen.sh
          ./configure --prefix="$PREFIX" \
                      --disable-bindings \
                      --enable-kingst-la2016
          make -j"$(nproc)"
          make install
          make install DESTDIR="$STAGE"

      # The runpath is what keeps this binary away from Debian's libsigrok.so.4
      # on the Pi.  Without it the loader searches the default path first, and
      # the LA2016 disappears from a binary that otherwise looks correct.
      #
      # --with-libsigrokdecode for the reason --enable-kingst-la2016 exists:
      # sigrok-cli's SR_ARG_OPT_PKG defaults to detect, so a missing
      # libsigrokdecode gives a binary with no -P and no error.  Given
      # explicitly, _SR_ARG_OPT_IMPL raises "libsigrokdecode support
      # requested, but it was not found."
      - name: Build and install sigrok-cli
        run: |
          set -euo pipefail
          cd src/sigrok-cli
          ./autogen.sh
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
            ./configure --prefix="$PREFIX" \
                        --with-libsigrokdecode \
                        LDFLAGS="-Wl,-rpath,$PREFIX/lib"
          make -j"$(nproc)"
          make install
          make install DESTDIR="$STAGE"

      # Every assertion below runs against $PREFIX, and the tarball is packed
      # from $STAGE.  libtool relinks a program at install time, so the two
      # copies are expected to be the same file; expected is not measured.
      # cmp makes the asserted file and the shipped file provably one file.
      - name: Assert the staged tree matches the tested tree
        run: |
          set -euo pipefail
          cmp "$PREFIX/bin/sigrok-cli"      "$STAGE$PREFIX/bin/sigrok-cli"
          cmp "$PREFIX/lib/libsigrok.so.4"  "$STAGE$PREFIX/lib/libsigrok.so.4"
          echo "staged binary and library are byte-identical to the tested ones"

      # The reason the run exists.  --list-supported reads the compile-time
      # driver registry, so it needs no analyser attached and no firmware on
      # disk; it proves the driver is in the binary and nothing more.  show.c
      # prints each driver with printf("  %-20s %s\n", name, longname), and
      # api.c sets .name = "kingst-la2016" and .longname = "Kingst LA2016".
      - name: Assert the kingst-la2016 driver is present
        run: |
          set -euo pipefail
          mkdir -p logs
          "$PREFIX/bin/sigrok-cli" --list-supported > logs/list-supported.txt
          if ! grep -qE '^[[:space:]]*kingst-la2016[[:space:]]+Kingst LA2016$' \
                 logs/list-supported.txt; then
            echo "kingst-la2016 is not in the driver list of the binary built in this job" >&2
            sed -n '/Supported hardware drivers/,/^$/p' logs/list-supported.txt >&2
            exit 1
          fi
          grep -E '^[[:space:]]*kingst-la2016' logs/list-supported.txt

      # A binary that lists the driver but loads Debian's 0.5.2 at runtime on
      # the Pi would fail there and pass here, so both halves of the mechanism
      # are checked.
      #
      # sigrok-cli --version prints the compile-time version from the header
      # and, after "rt:", the version reported from inside the loaded shared
      # library: show.c line 74, printf("- libsigrok %s/%s (rt: %s/%s).\n").
      # Only the loaded library carries the commit hash, because version.h.in
      # includes git-version.h solely when WANT_LIBSIGROK_GIT_VERSION_H is
      # defined, which is the library build.
      #
      # The hash is compared against the clone rather than merely matched as a
      # hash, so the string identifies this commit and not any git build of
      # libsigrok.  m4/sigrok.m4 derives the suffix from
      # `git describe --always`, whose abbreviation length can differ from
      # `git rev-parse --short`, so the test is prefix containment against the
      # full SHA rather than string equality.
      #
      # This container has no libsigrok4t64 installed, so the check confirms
      # the stamp rather than the arbitration.  The runpath decides the
      # arbitration on a Pi that does have the Debian package, so it is
      # asserted as well, and the ELF machine is asserted because nothing else
      # in the run reads it.
      - name: Assert sigrok-cli loads the libsigrok built here
        run: |
          set -euo pipefail
          sha=$(git -C src/libsigrok rev-parse HEAD)
          version=$("$PREFIX/bin/sigrok-cli" --version)
          printf '%s\n' "$version"
          hash=$(sed -n 's/.*rt: [0-9][0-9.]*-git-\([0-9a-f]\{7,\}\).*/\1/p' \
                 <<<"$version" | head -1)
          if [ -z "$hash" ]; then
            echo "the loaded libsigrok reports no commit hash" >&2
            exit 1
          fi
          case "$sha" in
            "$hash"*) echo "loaded libsigrok reports $hash, a prefix of $sha" ;;
            *) echo "loaded libsigrok reports $hash, which is not a prefix of $sha" >&2
               exit 1 ;;
          esac
          if ! grep -q 'libsigrokdecode' <<<"$version"; then
            echo "sigrok-cli reports no libsigrokdecode, so -P is unavailable" >&2
            exit 1
          fi
          ldd "$PREFIX/bin/sigrok-cli" > logs/ldd-sigrok-cli.txt
          if ! grep -qF "$PREFIX/lib/libsigrok.so" logs/ldd-sigrok-cli.txt; then
            echo "sigrok-cli resolves libsigrok outside $PREFIX/lib" >&2
            cat logs/ldd-sigrok-cli.txt >&2
            exit 1
          fi
          readelf -d "$PREFIX/bin/sigrok-cli" > logs/readelf-sigrok-cli.txt
          if ! grep -qE "(RUNPATH|RPATH).*$PREFIX/lib" logs/readelf-sigrok-cli.txt; then
            echo "sigrok-cli carries no runpath for $PREFIX/lib" >&2
            exit 1
          fi
          if ! readelf -h "$PREFIX/bin/sigrok-cli" | grep -q 'Machine:.*AArch64'; then
            echo "sigrok-cli is not an AArch64 binary" >&2
            readelf -h "$PREFIX/bin/sigrok-cli" | grep Machine >&2
            exit 1
          fi

      # The rules are in EXTRA_DIST only, so make install places none of them.
      # They travel in the tarball and the Pi's administrator puts them in
      # /etc/udev/rules.d, which overrides /usr/lib/udev/rules.d where the
      # Debian package writes its copies.
      #
      # The plugdev rule, not the uaccess one: uaccess grants access through
      # systemd-logind to a user on a local seat, and an SSH session has no
      # seat.  The bench is driven over SSH, so the seat-independent rule is
      # the one that grants anything.  60- tags the device, 61- acts on the
      # tag; the ordering is what makes that work.
      #
      # libsigrok_ref is a dispatch input, so the vendor and product pair is
      # checked rather than assumed.  Without that line the device never gets
      # ID_SIGROK, the 61- rule never fires, and the result reads as a
      # permissions problem with no cause visible.
      - name: Stage the udev rules and the firmware note
        run: |
          set -euo pipefail
          if ! grep -qE 'idVendor}=="77a1".*idProduct}=="01a2"' \
                 src/libsigrok/contrib/60-libsigrok.rules; then
            echo "60-libsigrok.rules has no entry for 77a1:01a2" >&2
            exit 1
          fi
          install -d "$STAGE$PREFIX/share/sigrok-udev"
          install -m 644 src/libsigrok/contrib/60-libsigrok.rules \
                         "$STAGE$PREFIX/share/sigrok-udev/"
          install -m 644 src/libsigrok/contrib/61-libsigrok-plugdev.rules \
                         "$STAGE$PREFIX/share/sigrok-udev/"
          install -d "$STAGE$PREFIX/share/sigrok-firmware"
          cat > "$STAGE$PREFIX/share/sigrok-firmware/README.txt" <<'EOF'
          The kingst-la2016 driver uploads two files to the analyser at scan time and
          reads both from disk.  protocol.c builds the names from
          MCU_FWFILE_FMT "kingst-la-%04x.fw" and FPGA_FWFILE_FMT
          "kingst-%s-fpga.bitstream":

            kingst-la-01a2.fw               FX2 microcontroller firmware
            kingst-<stem>-fpga.bitstream    FPGA bitstream

          Neither is in this tarball.  Both are Kingst material with no redistribution
          grant.  They are extracted from the vendor software KingstVIS with
          sigrok-fwextract-kingst-la2016 from sigrok-util:

            tar -xzf KingstVIS_v3.5.0_linux.tar.gz KingstVIS
            sigrok-fwextract-kingst-la2016 KingstVIS/KingstVIS

          The extractor's man page records what KingstVIS v3.5.0 yields -- five files,
          with these sizes and CRC-32 values:

            kingst-la-01a2.fw                   5430 bytes  crc32=720551a9
            kingst-la2016a1-fpga.bitstream    178362 bytes  crc32=7cc894fa
            kingst-la2016-fpga.bitstream      178542 bytes  crc32=20694ff1
            kingst-la1016a1-fpga.bitstream    178379 bytes  crc32=166866be
            kingst-la1016-fpga.bitstream      178151 bytes  crc32=7db70001

          What a given analyser needs is decided by two EEPROM magic bytes read at scan
          time.  protocol.h declares them as "uint8_t magic, magic2", and the models
          table in protocol.c keys on both: 0x02/0x01 and 0x08/0x00 select stem
          la2016a1, 0x02/0x00 selects la2016, 0x0b/0x10 selects la2016a2, 0x03/0x01 and
          0x09/0x00 select la1016a1, and 0x03/0x00 selects la1016.  Copy all extracted
          bitstreams here rather than choosing one.

          The la2016a2 stem is in the driver but is not among the five files KingstVIS
          v3.5.0 produces.  Which KingstVIS version emits it is unknown here, and the
          extractor's behaviour on versions after 3.5.0 is untested.  An analyser whose
          EEPROM reports 0x0b/0x10 therefore enumerates and then finds no bitstream.

          libsigrok searches, in this order, per sr_resourcepaths_get() in resource.c:

            1. $SIGROK_FIRMWARE_DIR
            2. each colon-separated entry of $SIGROK_FIRMWARE_PATH
            3. $XDG_DATA_HOME/sigrok-firmware, default ~/.local/share/sigrok-firmware
            4. this directory, which is compiled into the library
            5. each $XDG_DATA_DIRS entry with /sigrok-firmware appended

          Entries 1 to 3 need no root.  Without the files the analyser enumerates,
          accepts a capture and returns nothing, which reads as a quiet bench rather
          than a broken one.  To see which file the driver wants:

            sigrok-cli -l 4 --driver kingst-la2016 --scan 2>&1 | grep -i bitstream
          EOF

      # libsigrok and sigrok-cli are GPLv3-or-later, and this job publishes
      # built binaries from a public repository.  GPLv3 section 6 wants the
      # corresponding source to accompany the object code or a written offer to
      # stand with it, and "corresponding source" includes the scripts that
      # control compilation.  All three parts travel in the tarball: each
      # project's own licence text, the upstream URL with the exact commit the
      # binary was built from, and the path to the workflow that built it,
      # which is public in the same repository as this file.
      #
      # The licence files are copied out of the clones rather than written
      # here, so a project that changes its licence ships the one it actually
      # carries at the commit that was built.
      - name: Stage the licences and the corresponding-source note
        run: |
          set -euo pipefail
          mkdir -p "$STAGE$PREFIX/share/licences"
          for proj in libsigrok sigrok-cli; do
            found=
            for name in COPYING COPYING.LESSER LICENSE LICENCE; do
              if [ -f "src/$proj/$name" ]; then
                install -m 644 "src/$proj/$name" \
                        "$STAGE$PREFIX/share/licences/$proj.$name"
                found=yes
              fi
            done
            if [ -z "$found" ]; then
              echo "$proj carries no licence file at this commit" >&2
              exit 1
            fi
          done
          {
            echo "Corresponding source for the binaries in this tarball."
            echo
            echo "libsigrok and sigrok-cli are GNU General Public License"
            echo "version 3 or later. Their licence texts are beside this file."
            echo
            echo "The binaries are built from unmodified upstream source at"
            echo "these commits. Nothing in rcbench patches either project, and"
            echo "no sigrok source is vendored into that repository."
            echo
            echo "  libsigrok   https://github.com/sigrokproject/libsigrok"
            echo "              $(git -C src/libsigrok rev-parse HEAD)"
            echo "  sigrok-cli  https://github.com/sigrokproject/sigrok-cli"
            echo "              $(git -C src/sigrok-cli rev-parse HEAD)"
            echo
            echo "Fetch either with:"
            echo "  git clone <url> && git -C <dir> checkout --detach <commit>"
            echo
            echo "The scripts that control compilation and installation are"
            echo ".github/workflows/testbench-sigrok.yml in"
            echo "https://github.com/subtilitas/rcbench -- the configure flags,"
            echo "the container image and the install steps are all in that one"
            echo "file. MANIFEST.txt beside this file records the base image"
            echo "digest and the package versions the build linked against."
          } > "$STAGE$PREFIX/share/licences/CORRESPONDING-SOURCE.txt"
          cat "$STAGE$PREFIX/share/licences/CORRESPONDING-SOURCE.txt"

      # The runtime closure, computed rather than guessed.  The install on the
      # Pi reads this file, so Debian's sigrok-cli and its libsigrok4t64 0.5.2
      # never have to be installed to obtain a set of libraries that is already
      # known exactly here.
      #
      # Anything under $PREFIX is dropped: libsigrok.so.4 comes from the
      # tarball and no Debian package owns it.  A library no package owns is a
      # failure rather than an omission, because a silently short list is a Pi
      # that cannot start the binary.
      - name: Record the runtime dependency closure
        run: |
          set -euo pipefail
          ldd "$PREFIX/bin/sigrok-cli" "$PREFIX/lib/libsigrok.so.4" \
            | awk '$2 == "=>" && $3 ~ /^\// { print $3 }' \
            | grep -v "^$PREFIX/" | sort -u > logs/runtime-libs.txt
          : > logs/runtime-depends.txt
          while read -r lib; do
            pkg=$(dpkg-query -S "$lib" 2>/dev/null | head -1 | cut -d: -f1) || true
            if [ -z "$pkg" ]; then
              real=$(readlink -f "$lib")
              pkg=$(dpkg-query -S "$real" 2>/dev/null | head -1 | cut -d: -f1) || true
            fi
            if [ -z "$pkg" ]; then
              echo "no Debian package owns $lib" >&2
              exit 1
            fi
            echo "$pkg" >> logs/runtime-depends.txt
          done < logs/runtime-libs.txt
          sort -u logs/runtime-depends.txt -o logs/runtime-depends.txt
          install -m 644 logs/runtime-depends.txt "$STAGE$PREFIX/RUNTIME-DEPENDS.txt"
          cat "$STAGE$PREFIX/RUNTIME-DEPENDS.txt"

      # The manifest records what the artifact holds, so a capture can be
      # traced to a commit later.  The runtime version string in the binary
      # carries a hash that is a prefix of the commit line below it; a tarball
      # whose binary disagrees with its manifest is not this build.
      #
      # The glibc floor is the highest symbol version the two ELF files
      # reference, which is the requirement.  The installed libc6 version is an
      # upper bound and is recorded separately, as an upper bound.
      - name: Write the manifest
        env:
          LIBSIGROK_REF: ${{ inputs.libsigrok_ref }}
          SIGROK_CLI_REF: ${{ inputs.sigrok_cli_ref }}
        run: |
          set -euo pipefail
          . /etc/os-release
          glibc_floor=$(objdump -T "$STAGE$PREFIX/bin/sigrok-cli" \
                                   "$STAGE$PREFIX/lib/libsigrok.so.4" \
                        | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' \
                        | sort -uV | tail -1)
          # The hashes are taken from the staged files, which are the bytes
          # that go into the tarball.  Hashing the build tree would record one
          # object and ship another if anything strips or re-links between the
          # two, and the bench would then report a shadow on a correct install
          # -- a check that fails on the good case, which is the one failure
          # mode that teaches an operator to ignore it.
          cli_sha256=$(sha256sum "$STAGE$PREFIX/bin/sigrok-cli" | cut -d' ' -f1)
          lib_sha256=$(sha256sum "$STAGE$PREFIX/lib/libsigrok.so.4" | cut -d' ' -f1)
          # Parsed from the binary's own output rather than composed from a tag,
          # so the recorded string is by construction what the binary prints and
          # the two cannot disagree about decoration.
          cli_version=$("$PREFIX/bin/sigrok-cli" --version | head -1 | awk '{print $2}')
          lib_version=$("$PREFIX/bin/sigrok-cli" --version \
                        | sed -n 's/.*rt: \([^ )]*\).*/\1/p' | head -1)
          {
            # Machine-readable first, one key per line, colon-separated.  Read
            # these with grep; they are data and not shell.  A check decides on
            # the two sha256 lines: a version string is a label, and two
            # different commits can carry one.
            echo "libsigrok-commit: $(git -C src/libsigrok rev-parse HEAD)"
            echo "sigrok-cli-commit: $(git -C src/sigrok-cli rev-parse HEAD)"
            echo "libsigrok-version: $lib_version"
            echo "sigrok-cli-version: $cli_version"
            echo "libsigrok-sha256: $lib_sha256"
            echo "sigrok-cli-sha256: $cli_sha256"
            echo "debian-version: $(cat /etc/debian_version)"
            echo "prefix: $PREFIX"
            echo "built-utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "libsigrok and sigrok-cli, built from git for Debian 13 arm64."
            echo
            echo "Built:                    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Workflow run:             ${GITHUB_RUN_ID:-unknown} attempt ${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "Runner:                   ${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown}"
            echo "Base image:               debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1"
            echo "Container architecture:   $(dpkg --print-architecture)"
            echo "ELF machine:              $(readelf -h "$STAGE$PREFIX/bin/sigrok-cli" | sed -n 's/^ *Machine: *//p')"
            echo "Distribution:             ${VERSION:-unknown}, /etc/debian_version $(cat /etc/debian_version)"
            echo "Compiler:                 $(gcc --version | head -1)"
            echo "Prefix:                   $PREFIX"
            echo "glibc floor:              $glibc_floor (highest GLIBC_ symbol version referenced)"
            echo
            echo "libsigrok ref requested:  $LIBSIGROK_REF"
            echo "libsigrok commit:         $(git -C src/libsigrok rev-parse HEAD)"
            echo "libsigrok commit date:    $(git -C src/libsigrok log -1 --format=%cI)"
            echo "sigrok-cli ref requested: $SIGROK_CLI_REF"
            echo "sigrok-cli commit:        $(git -C src/sigrok-cli rev-parse HEAD)"
            echo "sigrok-cli commit date:   $(git -C src/sigrok-cli log -1 --format=%cI)"
            echo
            echo "Versions as the binaries report them:"
            "$PREFIX/bin/sigrok-cli" --version | sed 's/^/  /'
            echo
            echo "Build dependencies, as installed in the container:"
            dpkg-query -W -f='  ${binary:Package} ${Version}\n' \
              libc6 libglib2.0-dev libzip-dev zlib1g-dev libusb-1.0-0-dev \
              libsigrokdecode-dev
            echo
            echo "Runtime packages, as installed in the container:"
            xargs -r dpkg-query -W -f='  ${binary:Package} ${Version}\n' \
              < "$STAGE$PREFIX/RUNTIME-DEPENDS.txt"
            echo
            echo "Shared libraries sigrok-cli resolves in the container:"
            sed 's/^/  /' logs/ldd-sigrok-cli.txt
            echo
            echo "Runpath in sigrok-cli:"
            readelf -d "$STAGE$PREFIX/bin/sigrok-cli" | grep -E 'RUNPATH|RPATH' \
              | sed 's/^/  /' || echo "  none"
            echo
            echo "Licences and corresponding source: share/licences"
            echo "Firmware: not included, see share/sigrok-firmware/README.txt"
            echo "udev rules: share/sigrok-udev, not installed by this tarball"
            echo "Runtime packages the Pi needs: RUNTIME-DEPENDS.txt"
          } > "$STAGE$PREFIX/MANIFEST.txt"
          cat "$STAGE$PREFIX/MANIFEST.txt"

      # A tar, not a directory upload.  actions/upload-artifact stores every
      # file 644 and every directory 755 and resolves each symlink into a full
      # copy of its target, which would leave sigrok-cli non-executable and
      # turn libsigrok.so -> libsigrok.so.4 -> libsigrok.so.4.0.0 into three
      # identical files with no soname chain for the loader.  tar keeps the
      # mode bits and the links.
      #
      # Ownership is forced to 0:0 because the tarball unpacks at / on the Pi.
      # opt/sigrok, not "." : packing "." emits a member for the staging root,
      # and extracting that at / applies its mode and ownership to / itself.
      #
      # The checks after the tar are what the listing is for.  Every
      # other assertion in this job runs against $PREFIX; these run against the
      # bytes that ship.  The containment check matters because the member list
      # is a property of the upstream commit, and libsigrok_ref is a dispatch
      # input: a commit whose Makefile.am installs outside the prefix would
      # write outside /opt on the bench host, as root.
      - name: Package the install tree
        run: |
          set -euo pipefail
          mkdir -p dist logs
          tar -czf "dist/$TARBALL" \
            -C "$STAGE" --owner=0 --group=0 --numeric-owner opt/sigrok
          ls -l dist
          # Recorded without the dist/ prefix so "sha256sum -c SHA256SUMS"
          # works from any directory holding the tarball.
          ( cd dist && sha256sum "$TARBALL" ) | tee logs/SHA256SUMS
          tar -tzf "dist/$TARBALL" > logs/tarball-contents.txt
          wc -l < logs/tarball-contents.txt
          # grep -v, not grep -qv: the exit status of "quiet" combined with
          # "invert" is not the same in every grep, so the decision is taken on
          # the text rather than on that status.
          outside=$(grep -v '^opt/sigrok\(/\|$\)' logs/tarball-contents.txt || true)
          if [ -n "$outside" ]; then
            echo "tarball has members outside opt/sigrok:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi
          for want in opt/sigrok/bin/sigrok-cli \
                      opt/sigrok/lib/libsigrok.so.4 \
                      opt/sigrok/share/sigrok-udev/60-libsigrok.rules \
                      opt/sigrok/share/sigrok-udev/61-libsigrok-plugdev.rules \
                      opt/sigrok/share/sigrok-firmware/README.txt \
                      opt/sigrok/share/licences/CORRESPONDING-SOURCE.txt \
                      opt/sigrok/share/licences/libsigrok.COPYING \
                      opt/sigrok/share/licences/sigrok-cli.COPYING \
                      opt/sigrok/RUNTIME-DEPENDS.txt \
                      opt/sigrok/MANIFEST.txt; do
            if ! grep -qx "$want" logs/tarball-contents.txt; then
              echo "missing from tarball: $want" >&2
              exit 1
            fi
          done
          echo "tarball holds opt/sigrok only, with every required member"

      - uses: actions/upload-artifact@v7
        id: upload-tarball
        with:
          # archive: false uploads the tarball as itself rather than wrapping
          # it in a zip, so the file that lands on the Pi is the file packed
          # here.  action.yml states that with archive: false the name of the
          # uploaded file becomes the artifact name, so name: is set to that
          # same string: the artifact is called
          # sigrok-kingst-la2016-debian13-arm64.tar.gz whichever of the two
          # rules applies.
          name: ${{ env.TARBALL }}
          path: dist/${{ env.TARBALL }}
          archive: false
          if-no-files-found: error

      # The digest goes where the operator already is.  The install compares
      # what it downloaded against these two lines on the run page; a sha256
      # computed with nothing to compare it against verifies nothing.
      - name: Record the tarball digests in the run summary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-tarball.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### $TARBALL"
            echo
            echo '```'
            cat logs/SHA256SUMS
            echo "artifact-digest ${ARTIFACT_DIGEST:-unset}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # config.log states why a driver or a library was skipped, which the job
      # log does not; it is worth having when an assertion above fails.
      - name: Collect the build logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p logs
          cp -f src/libsigrok/config.log logs/libsigrok-config.log || true
          cp -f src/sigrok-cli/config.log logs/sigrok-cli-config.log || true
          cp -f "$STAGE$PREFIX/MANIFEST.txt" logs/MANIFEST.txt || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs
          path: logs
          if-no-files-found: warn

  verify:
    name: Run the tarball with runtime packages only
    needs: build
    runs-on: ubuntu-24.04-arm
    # The same pinned digest as the build job.  Changing one without the other
    # makes this job test an image the artifact was not built against.
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.TARBALL }}

      # The artifact is stored unarchived, so what lands is the tarball.  The
      # find covers the case where the download places it inside a directory
      # named after the artifact, which is the same shape the install has to
      # handle on the Pi.
      - name: Unpack the tarball at /
        run: |
          set -euo pipefail
          ls -lR .
          tarball=$(find . -name "$TARBALL" -type f | head -1)
          if [ -z "$tarball" ]; then
            echo "no regular file named $TARBALL in the download" >&2
            exit 1
          fi
          sha256sum "$tarball"
          tar -C / -xzf "$tarball"
          cat "$PREFIX/MANIFEST.txt"

      # Only the closure the build job recorded.  No -dev package, no Debian
      # sigrok package, nothing that would supply a library the tarball needs
      # but does not declare.  This is the step that distinguishes a build
      # container from a Pi.
      - name: Install the recorded runtime packages only
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          mapfile -t pkgs < "$PREFIX/RUNTIME-DEPENDS.txt"
          printf 'installing: %s\n' "${pkgs[*]}"
          apt-get update
          apt-get install -y --no-install-recommends "${pkgs[@]}"
          status=$(dpkg-query -W -f='${db:Status-Status}' libsigrok4t64 2>/dev/null || true)
          if [ "$status" = installed ]; then
            echo "the runtime closure pulled Debian's libsigrok4t64, which the /opt prefix exists to avoid" >&2
            exit 1
          fi

      # ldd before any tool is added, so no package installed for the sake of
      # the test can satisfy a dependency the tarball failed to declare.  ldd
      # comes from libc-bin, which is present in the base image.
      - name: Assert every runtime library resolves
        run: |
          set -euo pipefail
          ldd "$PREFIX/bin/sigrok-cli" "$PREFIX/lib/libsigrok.so.4" \
            | tee /tmp/ldd-verify.txt
          if grep -q 'not found' /tmp/ldd-verify.txt; then
            echo "libraries above are missing with only RUNTIME-DEPENDS.txt installed" >&2
            exit 1
          fi
          if ! grep -qF "$PREFIX/lib/libsigrok.so" /tmp/ldd-verify.txt; then
            echo "sigrok-cli resolves libsigrok outside $PREFIX/lib" >&2
            exit 1
          fi

      - name: Assert the unpacked binary drives the LA2016 driver
        env:
          LIBSIGROK_SHA: ${{ needs.build.outputs.libsigrok_sha }}
        run: |
          set -euo pipefail
          version=$("$PREFIX/bin/sigrok-cli" --version)
          printf '%s\n' "$version"
          hash=$(sed -n 's/.*rt: [0-9][0-9.]*-git-\([0-9a-f]\{7,\}\).*/\1/p' \
                 <<<"$version" | head -1)
          if [ -z "$hash" ]; then
            echo "the loaded libsigrok reports no commit hash" >&2
            exit 1
          fi
          case "$LIBSIGROK_SHA" in
            "$hash"*) echo "unpacked libsigrok reports $hash, a prefix of $LIBSIGROK_SHA" ;;
            *) echo "unpacked libsigrok reports $hash, which is not a prefix of $LIBSIGROK_SHA" >&2
               exit 1 ;;
          esac
          "$PREFIX/bin/sigrok-cli" --list-supported > /tmp/list-supported.txt
          if ! grep -qE '^[[:space:]]*kingst-la2016[[:space:]]+Kingst LA2016$' \
                 /tmp/list-supported.txt; then
            echo "kingst-la2016 is not in the driver list of the unpacked binary" >&2
            exit 1
          fi
          # A scan with no analyser attached returns no devices and exits 0.
          # It is run because it is the first code path that touches libusb,
          # and a missing libusb shows here rather than on the bench.
          "$PREFIX/bin/sigrok-cli" --driver kingst-la2016 --scan

      # binutils last, and only for readelf.  It pulls libc6 and zlib1g, both
      # already in the closure, so it cannot mask a missing library in the
      # checks above.
      - name: Assert the shipped binary is AArch64 and keeps its runpath
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends binutils
          readelf -h "$PREFIX/bin/sigrok-cli" | grep Machine
          if ! readelf -h "$PREFIX/bin/sigrok-cli" | grep -q 'Machine:.*AArch64'; then
            echo "the shipped sigrok-cli is not an AArch64 binary" >&2
            exit 1
          fi
          readelf -d "$PREFIX/bin/sigrok-cli" | grep -E 'RUNPATH|RPATH'
          if ! readelf -d "$PREFIX/bin/sigrok-cli" \
               | grep -qE "(RUNPATH|RPATH).*$PREFIX/lib"; then
            echo "the shipped sigrok-cli carries no runpath for $PREFIX/lib" >&2
            exit 1
          fi
