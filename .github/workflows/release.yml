name: Release

# A tag ships both processors.  The panel refuses to arm when the protocol
# versions disagree, so a release with one image is not runnable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PICO_SDK_TAG: '2.3.0'

jobs:
  # The tag is the only thing that says which version this is, and the images
  # carry their own.  A tag pushed without moving rcbench_version.h would
  # publish a v0.8.0 archive holding a 0.7.0 image, and the panel prints what
  # the coprocessor reports rather than what the archive was called.
  version:
    name: The tag matches the images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The tag, not the ref the run started from, and qualified as a tag.
          # On a manual dispatch the run's own ref is a branch, and a bare name
          # handed to checkout resolves as a branch before a tag -- so a branch
          # sharing the tag's name would be built and published under it.
          # --verify-tag does not catch that: it only asks whether the tag
          # exists, not whether this is what was built.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Every expression in this file reaches a script through the environment
      # and none is interpolated into one.  A ref name is attacker-controlled
      # text and git allows $, ( and ) in one, so a tag substituted straight
      # into a shell assignment runs whatever it was named -- before the
      # comparison below could reject it, with this job's write-scoped token
      # and checkout's persisted credentials in reach.
      - name: Compare
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          H=shared/link/include/rcbench_version.h
          maj=$(sed -n 's/^#define RCBENCH_VERSION_MAJOR *//p' "$H")
          min=$(sed -n 's/^#define RCBENCH_VERSION_MINOR *//p' "$H")
          pat=$(sed -n 's/^#define RCBENCH_VERSION_PATCH *//p' "$H")
          want="v$maj.$min.$pat"
          echo "tag $TAG, images $want"
          [ "$TAG" = "$want" ] || {
            echo "::error::$TAG does not match $want in $H"
            exit 1
          }

  panel:
    needs: [version]
    name: Panel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The tag, not the ref the run started from, and qualified as a tag.
          # On a manual dispatch the run's own ref is a branch, and a bare name
          # handed to checkout resolves as a branch before a tag -- so a branch
          # sharing the tag's name would be built and published under it.
          # --verify-tag does not catch that: it only asks whether the tag
          # exists, not whether this is what was built.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: 'firmware/panel'
          # A single image flashable at 0x0, as well as the three parts.
          # Flashing bootloader, partition table and app at three offsets is
          # three chances to get an offset wrong; the merged one has none.
          command: idf.py build && idf.py merge-bin -o rcbench-panel-merged.bin

      - uses: actions/upload-artifact@v7
        with:
          name: panel
          path: |
            firmware/panel/build/rcbench-panel-merged.bin
            firmware/panel/build/rcbench-panel.bin
            firmware/panel/build/rcbench-panel.elf
            firmware/panel/build/bootloader/bootloader.bin
            firmware/panel/build/partition_table/partition-table.bin
            firmware/panel/build/flash_args
          if-no-files-found: error

  iomcu:
    name: Coprocessor image
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The tag, not the ref the run started from, and qualified as a tag.
          # On a manual dispatch the run's own ref is a branch, and a bare name
          # handed to checkout resolves as a branch before a tag -- so a branch
          # sharing the tag's name would be built and published under it.
          # --verify-tag does not catch that: it only asks whether the tag
          # exists, not whether this is what was built.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Ubuntu's packaged toolchain rather than ARM's tarball: one line, and
      # the RP2350's Cortex-M33 needs nothing newer.  Fallback if the package
      # fails: ARM's 14.2 release, unpacked and put on PATH.
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev

      - name: Cache the pico-sdk
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}

      - name: Clone the pico-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_TAG" --recursive \
            --shallow-submodules https://github.com/raspberrypi/pico-sdk.git

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware/iomcu -B firmware/iomcu/build -G Ninja
          cmake --build firmware/iomcu/build -j"$(nproc)"

      - uses: actions/upload-artifact@v7
        with:
          name: iomcu
          path: |
            firmware/iomcu/build/rcbench-iomcu.uf2
            firmware/iomcu/build/rcbench-iomcu.elf
          if-no-files-found: error

  publish:
    name: Package and publish
    needs: [panel, iomcu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The tag, not the ref the run started from, and qualified as a tag.
          # On a manual dispatch the run's own ref is a branch, and a bare name
          # handed to checkout resolves as a branch before a tag -- so a branch
          # sharing the tag's name would be built and published under it.
          # --verify-tag does not catch that: it only asks whether the tag
          # exists, not whether this is what was built.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Package
        env:
          # The dispatch input first: on a manual run the ref name is the
          # branch, so taking it first would name the archives after one.
          # Through the environment, for the reason the version job gives.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          # One archive per processor: they are flashed by different tools
          # over different cables, and the UF2 (USB flashing format) image
          # does not belong inside an ESP-IDF (Espressif Internet-of-Things
          # Development Framework) archive.  The panel archive carries the
          # merged image, which goes to 0x0 on its own, and the three parts
          # for flashing them separately.
          (cd artifacts/panel && zip -r "../../dist/rcbench-panel-$TAG.zip" .)
          (cd artifacts/iomcu && zip -r "../../dist/rcbench-iomcu-$TAG.zip" .)
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # --verify-tag, because a tag gh has to invent is created from the
          # default branch: without it a dispatch for a tag nobody pushed
          # would attach these images to whatever main happened to be.
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            --repo "$REPO" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes
