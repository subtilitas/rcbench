name: Docs

# Publishes docs/ to the repository's GitHub wiki.  The wiki is an ordinary
# git repo (<repo>.wiki.git), so this is a checkout, a mirror of the files and
# a push -- no third-party action involved.
#
# The wiki must exist before the first run: create one page by hand in the
# repository's Wiki tab, otherwise the clone below 404s.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish docs to the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source

      # A wiki that has never had a page does not exist as a git repository,
      # and cannot be created over the API -- only by adding one page in the
      # Wiki tab.  Without this the job fails with a bare "Repository not
      # found", which is a true statement that explains nothing.
      - name: Clone the wiki
        run: |
          if ! git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki 2>clone.log
          then
            cat clone.log
            echo
            echo "::error::The wiki has no pages yet, so ${{ github.repository }}.wiki.git does not exist."
            echo "::error::Create one page by hand in the repository's Wiki tab, then re-run this workflow."
            exit 1
          fi

      - name: Mirror docs/ into the wiki
        run: |
          # Drop the previously published pages so deletions propagate, but
          # keep the wiki's own .git directory.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/docs/. wiki/

      # A wiki page is addressed by its title with no extension, so a link to
      # `Screens.md` downloads the file instead of opening the page.  In the
      # repository the opposite holds, and check_docs.py holds every link to
      # it.  Neither source is bent to suit the other: the translation happens
      # here, on the way out, and only to the copy.
      - name: Point the links at wiki pages rather than at files
        run: python3 source/tools/wiki_links.py wiki

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches docs/"
            exit 0
          fi
          git commit -m "docs: sync from ${{ github.sha }}"
          # Somebody editing a page in the wiki UI while this runs would
          # otherwise fail the push outright.
          git pull --rebase
          git push
