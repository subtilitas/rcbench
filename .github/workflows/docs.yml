name: Docs

# Publishes docs/ to the repository's GitHub wiki.  The wiki is an ordinary
# git repository (<repo>.wiki.git), so this is a checkout, a mirror of the
# files and a push, with no third-party action.
#
# The wiki must exist before the first run: create one page by hand in the
# repository's Wiki tab, otherwise the clone below fails with 404.
#
# A push to main starts this workflow and CI (continuous integration) at the
# same moment.  The job waits for the CI run on its commit and publishes
# only when that run passed, so a page reaches the wiki after check_docs.py
# and the rest of CI have held it to the tree, and a commit CI fails
# publishes nothing.  A manual run is held to the same rule.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: write
  # To read the CI run of the commit being published.
  actions: read

jobs:
  publish:
    name: Publish docs to the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source

      # Before anything is cloned or pushed.  ci_gate.py waits up to 5400 s
      # for the CI run on this commit and fails unless one passed.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 source/tools/ci_gate.py --repo "$REPO" --sha "$SHA"

      # A wiki with no page does not exist as a git repository and cannot be
      # created over the API (application programming interface), only by
      # adding one page in the Wiki tab.  Without this message the job fails
      # with a bare "Repository not found".
      # Through the environment, not interpolated into the script: a secret
      # substituted into a command line is a secret in the shell's trace and
      # in anything that echoes the command.
      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! git clone \
            "https://x-access-token:$TOKEN@github.com/$REPO.wiki.git" \
            wiki 2>clone.log
          then
            cat clone.log
            echo
            echo "::error::The wiki has no pages yet, so $REPO.wiki.git does not exist."
            echo "::error::Create one page by hand in the repository's Wiki tab, then re-run this workflow."
            exit 1
          fi

      - name: Mirror docs/ into the wiki
        run: |
          # Remove the pages the wiki holds so deletions propagate; keep its
          # .git directory.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/docs/. wiki/

      # A wiki page is addressed by its title with no extension, so a link to
      # `Screens.md` downloads the file instead of opening the page.  In the
      # repository the opposite holds, and check_docs.py holds every link to
      # it.  The translation happens here, on the way out, and only to the
      # copy.
      - name: Point the links at wiki pages rather than at files
        run: python3 source/tools/wiki_links.py wiki

      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches docs/"
            exit 0
          fi
          git commit -m "docs: sync from $SHA"
          # A page edited in the wiki UI (user interface) while this runs
          # would otherwise fail the push.
          git pull --rebase
          git push
