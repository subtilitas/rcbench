name: Configurator

# Checks, builds and publishes the bench configurator under configurator/,
# the panel's web help under help/ and the C API (application programming
# interface) reference under api/ of the same site.
#
# - changes: decides with tools/pages_changes.py whether the run is a full
#   one.  A pull request or push that changes a path of its FULL_PATHS (the
#   configurator, the help and their inputs, this file) runs every job.
#   One that changes only the sources of the API reference (the C sources,
#   the Doxyfile, tools/install_doxygen.sh) skips core, smoke, matrix and
#   the checks of build: it builds the configurator page as it stands, the
#   help and the API reference, and on main deploys them.
# - core: type check, test suite, static checks on the data file against the
#   tree at the release tag, the release of package.json against the firmware
#   header rcbench_version.h, and the coverage figure in
#   configurator/core/README.md.
# - build: type check and unit tests of the page, the check of the part
#   drawings against the data file, the Vite build, the size budget (250kB
#   initial, 1MB total). The built page is an artifact of every run; a run
#   that is not a full one builds it without the checks.
# - smoke: Playwright against the built page at 360px and 1280px width.
# - matrix: Playwright against the built page in 8 cells (360 x 740px and
#   1280 x 800px, English and German, light and dark, reduced motion) and
#   on every link of the hash corpus, in 4 shards. No test is retried. A
#   failed test leaves its trace and screenshot as an artifact for 14 days.
# - help: builds the web help with tools/help_site.py from help/content/
#   and the screenshots in docs/img/. The build runs every check of the
#   help first and fails on one. The built help is an artifact of every run.
# - api: builds the HTML reference of the C sources with Doxygen 1.18.0 and
#   the Doxyfile at the repository root. Pass and fail of the comments are
#   tools/doc_check.py's in ci.yml; this job publishes. The built reference
#   is an artifact of every run.
# - deploy: publishes the built page to GitHub Pages, with the help in its
#   help/ folder and the API reference in its api/ folder. It runs on a
#   push to main only, when every job that ran passed. A pull request
#   builds and tests and publishes
#   nothing. Neither the help nor the API reference is part of the
#   configurator's size budget: the budget is checked on the
#   configurator's files alone.
#
# The repository setting "Pages source: GitHub Actions" is a precondition of
# the deploy job.

on:
  pull_request:
    paths:
      - 'configurator/**'
      - 'shared/link/include/rcbench_version.h'
      - '.github/workflows/pages.yml'
      - 'help/**'
      - 'docs/img/**'
      - 'tools/help_site.py'
      - 'tools/render_ui.py'
      - 'shared/ui/include/ui_screen.h'
      - 'Doxyfile'
      - 'tools/install_doxygen.sh'
  push:
    branches: [main]
    paths:
      - 'configurator/**'
      - 'shared/link/include/rcbench_version.h'
      - '.github/workflows/pages.yml'
      - 'help/**'
      - 'docs/img/**'
      - 'tools/help_site.py'
      - 'tools/render_ui.py'
      - 'shared/ui/include/ui_screen.h'
      # The sources of the API reference.  A pull request that changes them
      # runs Doxygen in ci.yml; main publishes the reference again.
      - 'Doxyfile'
      - 'tools/install_doxygen.sh'
      - 'shared/**'
      - 'protocols/**'
      - 'firmware/panel/**'
      - 'firmware/iomcu/**'
      - 'testbench/touch-injector/core/**'

# A newer push to a pull request replaces the run in progress. A run on main
# finishes, so a deployment is never cut off.
concurrency:
  group: configurator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The release ci.yml checks the comments with; the same pin.
  DOXYGEN_VERSION: 1.18.0
  DOXYGEN_SHA256: >-
    14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90

jobs:
  changes:
    name: Full run or API only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for the list of earlier runs of this workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit changes are counted from has to be here.
          fetch-depth: 0

      # tools/pages_changes.py holds FULL_PATHS and the rule.  A push counts
      # its changes from the head commit of the newest successful push run
      # of this workflow on main, so a push after a failed or cancelled run
      # is tested against what was last published.  No such run, or a
      # commit that is not an ancestor of HEAD, makes a full run.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          runs="$RUNNER_TEMP/runs.json"
          query="branch=main&event=push&status=success&per_page=1"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs"
          if [ "$EVENT" = push ]; then
            gh api "$api?$query" > "$runs" || echo '{}' > "$runs"
          fi
          python3 tools/pages_changes.py --event "$EVENT" --base "$BASE" \
            --runs "$runs" | tee -a "$GITHUB_OUTPUT"

  core:
    name: Configurator core
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: configurator/core
    # The clone below holds every tag, so a release tag absent here is not
    # made yet: the release pull request, and its push to main before the
    # tag. Then the check and the tests read the sources at HEAD when its
    # firmware header names the release of package.json.
    env:
      CONFIGURATOR_BEFORE_TAG: '1'
    steps:
      # The data file anchors every fact to a file and line at a release tag.
      # The check reads those files from git, so the clone holds the full
      # history and the tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # configurator/core has no dependency and no lock file.  The compiler
      # and the Node.js type declarations go into the runner's temporary
      # folder at pinned versions.
      - name: Install the type checker
        run: >
          npm install --no-save --no-package-lock --no-audit --no-fund
          --prefix "$RUNNER_TEMP/tsc"
          typescript@7.0.2 @types/node@24.19.2

      - name: Type check
        run: >
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" --noEmit -p tsconfig.json
          --typeRoots "$RUNNER_TEMP/tsc/node_modules/@types" --types node

      - name: Test suite
        run: npm test

      # --strict fails when git is absent, or when the release tag is absent
      # and the firmware header at HEAD names another release, so the
      # anchors are always read: at the tag, or at HEAD in the release pull
      # request before the tag exists (CONFIGURATOR_BEFORE_TAG above).
      # A warning does not fail the step. Each one becomes an annotation of
      # the run and a line of its summary: a release tag newer than the data
      # is a warning. The step ends with the exit code of the check, so a
      # run with errors shows its warnings too. The Release workflow runs the
      # same script on every tag push.
      - name: Check the data file
        shell: bash
        run: bash tools/check-annotate.sh

      - name: Check the coverage figure
        run: npm run coverage -- --check

  build:
    name: Configurator page
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      # A stand-in for the core carries reduced data.  A page built on it
      # would show a reduced wiring as if it were complete.
      - name: Refuse a build on a stand-in for the core
        run: |
          test ! -e src/stub
          grep -q "from '../core/index.ts'" src/core.ts

      - run: npm ci

      - name: Type check
        if: needs.changes.outputs.full == 'true'
        run: npm run typecheck

      - name: Unit tests and the geometry sweep
        if: needs.changes.outputs.full == 'true'
        run: npm test

      # Fails when a pin of the data file has no anchor, an anchor has no
      # pin, a label differs in English or German, a wire end has no anchor,
      # a wire colour is below 3:1 on a page background, or a committed
      # drawing differs from the output of the generator.
      - name: Check the part drawings against the data file
        if: needs.changes.outputs.full == 'true'
        run: npm run drawings:check

      - name: Build
        run: npm run build

      - name: Size budget
        if: needs.changes.outputs.full == 'true'
        run: npm run size

      - name: Keep the built page
        uses: actions/upload-artifact@v7
        with:
          name: configurator-dist
          path: configurator/dist
          if-no-files-found: error
          retention-days: 14

      # 2 files of the PDF export for a look at the result: the setup with the
      # fewest wires in English and the setup with the most wires in German.
      - name: Write the PDF samples
        if: needs.changes.outputs.full == 'true'
        run: node tools/pdf-samples.ts pdf-samples

      - name: Keep the PDF samples
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: configurator-pdf-samples
          path: configurator/pdf-samples/*.pdf
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Configurator smoke test
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - run: npm ci

      # The test runs against the files of the build job, the same files the
      # deploy job publishes.
      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: configurator/dist

      # The install fetches system packages and takes up to 12.5min on a
      # slow runner; it has its own limit, and the tests keep theirs.
      - name: Install Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Smoke test at 360 px and 1280 px
        timeout-minutes: 15
        run: npm run e2e

      # 3 setups of the wiring picture as the browser draws them. The files
      # are not committed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: configurator-diagram-shots
          path: configurator/test-results/diagram-shots
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-smoke-failures
          path: configurator/test-results
          if-no-files-found: ignore
          retention-days: 14

  matrix:
    name: Configurator matrix test (${{ matrix.shard }}/4)
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: configurator/dist

      # The install fetches system packages and takes up to 12.5min on a
      # slow runner; it has its own limit, and the tests keep theirs.
      - name: Install Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Matrix and corpus tests
        timeout-minutes: 15
        run: npm run e2e:matrix -- --shard=${{ matrix.shard }}/4

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-matrix-failures-${{ matrix.shard }}
          path: configurator/test-results
          if-no-files-found: ignore
          retention-days: 14

  help:
    name: Web help
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The help publishes docs/img; a screenshot that is not the panel's
      # render fails here as it fails in ci.yml, so Pages never carries one.
      # The renderer needs the runner image's C compiler and Pillow.
      - name: The committed screenshots match the current render
        run: |
          python3 -m pip install pillow==12.3.0
          python3 tools/render_ui.py --check

      # Python 3 of the runner image and its standard library: the
      # generator imports nothing else.
      - name: Build the help
        run: python3 tools/help_site.py --out help-site

      - name: Keep the built help
        uses: actions/upload-artifact@v7
        with:
          name: help-site
          path: help-site
          if-no-files-found: error
          retention-days: 14

  api:
    name: API reference
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The archive is 115MB; the cache holds it, and the script checks
      # its SHA-256 on a hit as on a download.
      - name: Restore the Doxygen archive
        uses: actions/cache@v6
        with:
          path: ~/doxygen-archive
          key: doxygen-${{ env.DOXYGEN_VERSION }}-${{ env.DOXYGEN_SHA256 }}

      - name: Install Doxygen
        run: |
          tools/install_doxygen.sh "$DOXYGEN_VERSION" "$DOXYGEN_SHA256" \
            "$RUNNER_TEMP/doxygen" ~/doxygen-archive

      # The Doxyfile writes the HTML into build/doxygen/html.  Doxygen
      # creates one directory level of OUTPUT_DIRECTORY, not two.
      - name: Build the API reference
        run: |
          mkdir -p build/doxygen
          "$RUNNER_TEMP/doxygen/bin/doxygen"
          du -sh build/doxygen/html

      - name: Keep the built reference
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: build/doxygen/html
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    # always(): core, smoke and matrix are skipped in a run that is not a
    # full one, and a skipped need would skip the deploy.  A failed or
    # cancelled job stops it.
    if: >-
      always() && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' && needs.help.result == 'success' &&
      needs.api.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [changes, core, build, smoke, matrix, help, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: dist

      # The help goes into a folder the configurator does not have, so no
      # file of the configurator is replaced.
      - name: The configurator has no help folder
        run: test ! -e dist/help

      - uses: actions/download-artifact@v8
        with:
          name: help-site
          path: dist/help

      - name: The configurator has no api folder
        run: test ! -e dist/api

      - uses: actions/download-artifact@v8
        with:
          name: api-reference
          path: dist/api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
