name: Configurator

# Checks, builds and publishes the bench configurator under configurator/.
#
# - core: type check, test suite, static checks on the data file against the
#   tree at the release tag, and the coverage figure in
#   configurator/core/README.md.
# - build: type check and unit tests of the page, the check of the part
#   drawings against the data file, the Vite build, the size budget (250 kB
#   initial, 1 MB total). The built page is an artifact of every run.
# - smoke: Playwright against the built page at 360 px and 1280 px width.
# - matrix: Playwright against the built page in 8 cells (360 x 740 px and
#   1280 x 800 px, English and German, light and dark, reduced motion) and
#   on every link of the hash corpus, in 4 shards. No test is retried. A
#   failed test leaves its trace and screenshot as an artifact for 14 days.
# - deploy: publishes the built page to GitHub Pages. It runs on a push to
#   main only. A pull request builds and tests and publishes nothing.
#
# The repository setting "Pages source: GitHub Actions" is a precondition of
# the deploy job.

on:
  pull_request:
    paths:
      - 'configurator/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'configurator/**'
      - '.github/workflows/pages.yml'

# A newer push to a pull request replaces the run in progress. A run on main
# finishes, so a deployment is never cut off.
concurrency:
  group: configurator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: Configurator core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: configurator/core
    steps:
      # The data file anchors every fact to a file and line at a release tag.
      # The check reads those files from git, so the clone holds the full
      # history and the tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # configurator/core has no dependency and no lock file.  The compiler
      # and the Node.js type declarations go into the runner's temporary
      # folder at pinned versions.
      - name: Install the type checker
        run: >
          npm install --no-save --no-package-lock --no-audit --no-fund
          --prefix "$RUNNER_TEMP/tsc"
          typescript@7.0.2 @types/node@24.19.2

      - name: Type check
        run: >
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" --noEmit -p tsconfig.json
          --typeRoots "$RUNNER_TEMP/tsc/node_modules/@types" --types node

      - name: Test suite
        run: npm test

      # --strict fails when git or the release tag is absent, so the anchors
      # are always read.
      # A warning does not fail the step. Each one becomes an annotation of
      # the run and a line of its summary: a release tag newer than the data
      # is a warning.
      - name: Check the data file
        shell: bash
        run: |
          npm run check -- --strict | tee "$RUNNER_TEMP/check.txt"
          warnings="$(grep '^warn ' "$RUNNER_TEMP/check.txt" || true)"
          if [ -n "$warnings" ]; then
            printf '%s\n' "$warnings" | sed 's/^warn /::warning title=Configurator data::/'
            {
              echo '### Configurator data: warnings'
              echo
              printf '%s\n' "$warnings" | sed 's/^warn /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the coverage figure
        run: npm run coverage -- --check

  build:
    name: Configurator page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      # A stand-in for the core carries reduced data.  A page built on it
      # would show a reduced wiring as if it were complete.
      - name: Refuse a build on a stand-in for the core
        run: |
          test ! -e src/stub
          grep -q "from '../core/index.ts'" src/core.ts

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests and the geometry sweep
        run: npm test

      # Fails when a pin of the data file has no anchor, an anchor has no
      # pin, a label differs in English or German, a wire end has no anchor,
      # a wire colour is below 3:1 on a page background, or a committed
      # drawing differs from the output of the generator.
      - name: Check the part drawings against the data file
        run: npm run drawings:check

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Keep the built page
        uses: actions/upload-artifact@v7
        with:
          name: configurator-dist
          path: configurator/dist
          if-no-files-found: error
          retention-days: 14

      # 2 files of the PDF export for a look at the result: the setup with the
      # fewest wires in English and the setup with the most wires in German.
      - name: Write the PDF samples
        run: node tools/pdf-samples.ts pdf-samples

      - name: Keep the PDF samples
        uses: actions/upload-artifact@v7
        with:
          name: configurator-pdf-samples
          path: configurator/pdf-samples/*.pdf
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Configurator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - run: npm ci

      # The test runs against the files of the build job, the same files the
      # deploy job publishes.
      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: configurator/dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test at 360 px and 1280 px
        run: npm run e2e

      # 3 setups of the wiring picture as the browser draws them. The files
      # are not committed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: configurator-diagram-shots
          path: configurator/test-results/diagram-shots
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-smoke-failures
          path: configurator/test-results
          if-no-files-found: ignore
          retention-days: 14

  matrix:
    name: Configurator matrix test (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: configurator/dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Matrix and corpus tests
        run: npm run e2e:matrix -- --shard=${{ matrix.shard }}/4

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-matrix-failures-${{ matrix.shard }}
          path: configurator/test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, build, smoke, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
