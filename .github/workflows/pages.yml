name: Configurator

# Checks, builds and publishes the bench configurator under configurator/,
# the panel's web help under help/ and the C API (application programming
# interface) reference under api/ of the same site.
#
# - changes: decides with tools/pages_changes.py whether the run is a full
#   one.  A pull request or push that changes a path of its FULL_PATHS (the
#   configurator, the help and their inputs, this file) runs every job.
#   One that changes only the sources of the API reference (the C sources,
#   the Doxyfile, tools/install_doxygen.sh) skips core, smoke, matrix and
#   the checks of build: it builds the configurator page as it stands, the
#   help and the API reference, and on main deploys them.
# - core: type check, test suite, static checks on the data file against the
#   tree at the release tag, the release of package.json against the firmware
#   header rcbench_version.h, and the coverage figure in
#   configurator/core/README.md.
# - build: type check and unit tests of the page, the check of the part
#   drawings against the data file, the Vite build, the size budget (260kB
#   initial, 1MB total). The built page is an artifact of every run; a run
#   that is not a full one builds it without the checks.
# - smoke: Playwright against the built page at 360px and 1280px width.
# - matrix: Playwright against the built page in 8 cells (360 x 740px and
#   1280 x 800px, English and German, light and dark, reduced motion) and
#   on every link of the hash corpus, in 4 shards. No test is retried. A
#   failed test leaves its trace and screenshot as an artifact for 14 days.
# - help: builds the web help with tools/help_site.py from help/content/
#   and the screenshots in docs/img/. The build runs every check of the
#   help first and fails on one. The built help is an artifact of every run.
# - api: builds the HTML reference of the C sources with Doxygen 1.18.0 and
#   the Doxyfile at the repository root. Pass and fail of the comments are
#   tools/doc_check.py's in ci.yml; this job publishes. The built reference
#   is an artifact of every run.
# - flasher: type check, unit tests, the check of the licence file against
#   the bundled packages, the Vite build and the size budget (80kB initial,
#   600kB total) of the web flasher under flasher/. The built page is an
#   artifact of every run.
# - flasher-e2e: Playwright against the built flasher at 1280px in English
#   and 360px in German, with fake Web Serial and WebUSB devices: the whole
#   flow of the panel, the Dial, the power node and the IOmcu to "done".
# - flash-fw: the firmware images the flasher offers. Picks the 6 newest
#   published releases and the newest stable release when it is older
#   (tools/flash_manifest.py select), downloads their assets with
#   `gh release download`, and writes fw/ with a manifest per release and
#   an index (tools/flash_manifest.py build), after the builder's tests. A
#   release download sends no CORS (cross-origin resource sharing) header,
#   so the page reads copies from its own site. The downloads are cached
#   per list of tags. fw/ is about 64MB for 7 releases (2026-11-21).
# - deploy: publishes the built page to GitHub Pages, with the help in its
#   help/ folder, the API reference in its api/ folder and the flasher in
#   flash/, its images in flash/fw/. It runs on a push to main and on a
#   manual run on main only, when every job that ran passed. A pull
#   request builds and tests and publishes
#   nothing. Neither the help, the API reference nor the flasher is part
#   of the configurator's size budget: the budget is checked on the
#   configurator's files alone.
#
# A pull request runs when the label `ci` is added, as ci.yml does: a push
# to a pull request starts no run.  Another label starts a run in which
# every job is skipped; no check of this workflow is a required one.
#
# The repository setting "Pages source: GitHub Actions" is a precondition of
# the deploy job.
#
# The Release workflow starts a manual run on main once it publishes a
# release (its pages job), so the flasher offers the new release's images.
# A run on the release event itself would carry the tag as its ref, and the
# github-pages environment deploys from main only.

on:
  pull_request:
    types: [labeled]
    paths:
      - 'configurator/**'
      - 'shared/link/include/rcbench_version.h'
      - '.github/workflows/pages.yml'
      - 'help/**'
      - 'docs/img/**'
      - 'tools/help_site.py'
      - 'tools/render_ui.py'
      - 'shared/ui/include/ui_screen.h'
      - 'Doxyfile'
      - 'tools/install_doxygen.sh'
      - 'flasher/**'
      - 'tools/flash_manifest.py'
      - 'test/tools/test_flash_manifest.py'
  push:
    branches: [main]
    paths:
      - 'configurator/**'
      - 'shared/link/include/rcbench_version.h'
      - '.github/workflows/pages.yml'
      - 'help/**'
      - 'docs/img/**'
      - 'tools/help_site.py'
      - 'tools/render_ui.py'
      - 'shared/ui/include/ui_screen.h'
      - 'flasher/**'
      - 'tools/flash_manifest.py'
      - 'test/tools/test_flash_manifest.py'
      # The sources of the API reference.  A pull request that changes them
      # runs Doxygen in ci.yml; main publishes the reference again.
      - 'Doxyfile'
      - 'tools/install_doxygen.sh'
      - 'shared/**'
      - 'protocols/**'
      - 'firmware/panel/**'
      - 'firmware/iomcu/**'
      - 'firmware/dial/**'
      - 'firmware/node/**'
      - 'firmware/devota/**'
      - 'testbench/touch-injector/core/**'
  # Started by release.yml after it publishes a release; by hand with
  # `gh workflow run pages.yml --ref main`.
  workflow_dispatch:

# A second `ci` label on a pull request replaces the run in progress; a run
# another label starts has a group of its own and replaces none. A run on
# main finishes, so a deployment is never cut off.
concurrency:
  group: configurator-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.label.name != 'ci' && '-other-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The release ci.yml checks the comments with; the same pin.
  DOXYGEN_VERSION: 1.18.0
  DOXYGEN_SHA256: >-
    14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90

jobs:
  changes:
    name: Full run or API only
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # actions: read for the list of earlier runs of this workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit changes are counted from has to be here.
          fetch-depth: 0

      # tools/pages_changes.py holds FULL_PATHS and the rule.  A push counts
      # its changes from the head commit of the newest successful push run
      # of this workflow on main, so a push after a failed or cancelled run
      # is tested against what was last published.  No such run, or a
      # commit that is not an ancestor of HEAD, makes a full run.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          runs="$RUNNER_TEMP/runs.json"
          query="branch=main&event=push&status=success&per_page=1"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs"
          if [ "$EVENT" = push ]; then
            gh api "$api?$query" > "$runs" || echo '{}' > "$runs"
          fi
          python3 tools/pages_changes.py --event "$EVENT" --base "$BASE" \
            --runs "$runs" | tee -a "$GITHUB_OUTPUT"

  core:
    name: Configurator core
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-26.04
    # The test suite and the coverage run, which repeats it, take 4min47s
    # to 8min12s together on the runners measured.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: configurator/core
    # The clone below holds every tag, so a release tag absent here is not
    # made yet: the release pull request, and its push to main before the
    # tag. Then the check and the tests read the sources at HEAD when its
    # firmware header names the release of package.json.
    env:
      CONFIGURATOR_BEFORE_TAG: '1'
    steps:
      # The data file anchors every fact to a file and line at a release tag.
      # The check reads those files from git, so the clone holds the full
      # history and the tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # configurator/core has no dependency and no lock file.  The compiler
      # and the Node.js type declarations go into the runner's temporary
      # folder at pinned versions.
      - name: Install the type checker
        run: >
          npm install --no-save --no-package-lock --no-audit --no-fund
          --prefix "$RUNNER_TEMP/tsc"
          typescript@7.0.2 @types/node@24.19.2

      - name: Type check
        run: >
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" --noEmit -p tsconfig.json
          --typeRoots "$RUNNER_TEMP/tsc/node_modules/@types" --types node

      - name: Test suite
        run: npm test

      # --strict fails when git is absent, or when the release tag is absent
      # and the firmware header at HEAD names another release, so the
      # anchors are always read: at the tag, or at HEAD in the release pull
      # request before the tag exists (CONFIGURATOR_BEFORE_TAG above).
      # A warning does not fail the step. Each one becomes an annotation of
      # the run and a line of its summary: a release tag newer than the data
      # is a warning. The step ends with the exit code of the check, so a
      # run with errors shows its warnings too. The Release workflow runs the
      # same script on every tag push.
      - name: Check the data file
        shell: bash
        run: bash tools/check-annotate.sh

      - name: Check the coverage figure
        run: npm run coverage -- --check

  build:
    name: Configurator page
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      # A stand-in for the core carries reduced data.  A page built on it
      # would show a reduced wiring as if it were complete.
      - name: Refuse a build on a stand-in for the core
        run: |
          test ! -e src/stub
          grep -q "from '../core/index.ts'" src/core.ts

      - run: npm ci

      - name: Type check
        if: needs.changes.outputs.full == 'true'
        run: npm run typecheck

      - name: Unit tests and the geometry sweep
        if: needs.changes.outputs.full == 'true'
        run: npm test

      # Fails when a pin of the data file has no anchor, an anchor has no
      # pin, a label differs in English or German, a wire end has no anchor,
      # a wire colour is below 3:1 on a page background, or a committed
      # drawing differs from the output of the generator.
      - name: Check the part drawings against the data file
        if: needs.changes.outputs.full == 'true'
        run: npm run drawings:check

      - name: Build
        run: npm run build

      - name: Size budget
        if: needs.changes.outputs.full == 'true'
        run: npm run size

      - name: Keep the built page
        uses: actions/upload-artifact@v7
        with:
          name: configurator-dist
          path: configurator/dist
          if-no-files-found: error
          retention-days: 14

      # 2 files of the PDF export for a look at the result: the setup with the
      # fewest wires in English and the setup with the most wires in German.
      - name: Write the PDF samples
        if: needs.changes.outputs.full == 'true'
        run: node tools/pdf-samples.ts pdf-samples

      - name: Keep the PDF samples
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: configurator-pdf-samples
          path: configurator/pdf-samples/*.pdf
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Configurator smoke test
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - run: npm ci

      # The test runs against the files of the build job, the same files the
      # deploy job publishes.
      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: configurator/dist

      # The install fetches system packages and takes up to 12.5min on a
      # slow runner; it has its own limit, and the tests keep theirs.
      - name: Install Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Smoke test at 360 px and 1280 px
        timeout-minutes: 15
        run: npm run e2e

      # 3 setups of the wiring picture as the browser draws them. The files
      # are not committed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: configurator-diagram-shots
          path: configurator/test-results/diagram-shots
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-smoke-failures
          path: configurator/test-results
          if-no-files-found: ignore
          retention-days: 14

  matrix:
    name: Configurator matrix test (${{ matrix.shard }}/4)
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: configurator/dist

      # The install fetches system packages and takes up to 12.5min on a
      # slow runner; it has its own limit, and the tests keep theirs.
      - name: Install Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Matrix and corpus tests
        timeout-minutes: 15
        run: npm run e2e:matrix -- --shard=${{ matrix.shard }}/4

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-matrix-failures-${{ matrix.shard }}
          path: configurator/test-results
          if-no-files-found: ignore
          retention-days: 14

  help:
    name: Web help
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The help publishes docs/img; a screenshot that is not the panel's
      # render fails here as it fails in ci.yml, so Pages never carries one.
      # The renderer needs the runner image's C compiler and Pillow.
      - name: The committed screenshots match the current render
        run: |
          python3 -m pip install pillow==12.3.0
          python3 tools/render_ui.py --check

      # Python 3 of the runner image and its standard library: the
      # generator imports nothing else.
      - name: Build the help
        run: python3 tools/help_site.py --out help-site

      - name: Keep the built help
        uses: actions/upload-artifact@v7
        with:
          name: help-site
          path: help-site
          if-no-files-found: error
          retention-days: 14

  api:
    name: API reference
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The archive is 115MB; the cache holds it, and the script checks
      # its SHA-256 on a hit as on a download.
      - name: Restore the Doxygen archive
        uses: actions/cache@v6
        with:
          path: ~/doxygen-archive
          key: doxygen-${{ env.DOXYGEN_VERSION }}-${{ env.DOXYGEN_SHA256 }}

      - name: Install Doxygen
        run: |
          tools/install_doxygen.sh "$DOXYGEN_VERSION" "$DOXYGEN_SHA256" \
            "$RUNNER_TEMP/doxygen" ~/doxygen-archive

      # The Doxyfile writes the HTML into build/doxygen/html.  Doxygen
      # creates one directory level of OUTPUT_DIRECTORY, not two.
      - name: Build the API reference
        run: |
          mkdir -p build/doxygen
          "$RUNNER_TEMP/doxygen/bin/doxygen"
          du -sh build/doxygen/html

      - name: Keep the built reference
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: build/doxygen/html
          if-no-files-found: error
          retention-days: 14

  flasher:
    name: Flasher page
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flasher
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flasher/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The build first holds public/licenses.txt to the bundled packages
      # (tools/licenses.ts --check).
      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Keep the built page
        uses: actions/upload-artifact@v7
        with:
          name: flasher-dist
          path: flasher/dist
          if-no-files-found: error
          retention-days: 14

  flasher-e2e:
    name: Flasher browser test
    needs: flasher
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flasher
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flasher/package-lock.json

      - run: npm ci

      # The test runs against the files the deploy job publishes.
      - uses: actions/download-artifact@v8
        with:
          name: flasher-dist
          path: flasher/dist

      - name: Install Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Browser test with fake devices
        timeout-minutes: 10
        run: npm run e2e

      - name: Keep the traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flasher-e2e-failures
          path: flasher/test-results
          if-no-files-found: ignore
          retention-days: 14

  flash-fw:
    name: Firmware images for the flasher
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # The tags: the IOmcu's partition table is read at each release tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test the manifest builder
        run: |
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest test/tools/test_flash_manifest.py -q

      - name: Pick the releases
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            > "$RUNNER_TEMP/releases.json"
          python3 tools/flash_manifest.py select "$RUNNER_TEMP/releases.json" \
            > "$RUNNER_TEMP/tags.txt"
          cat "$RUNNER_TEMP/tags.txt"
          echo "key=flash-releases-1-$(sha256sum < "$RUNNER_TEMP/tags.txt" \
            | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # About 175MB of downloads for 7 releases; a run with the same tags
      # takes them from the cache.
      - name: Restore the release downloads
        uses: actions/cache@v6
        with:
          path: ~/flash-releases
          key: ${{ steps.pick.outputs.key }}

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag; do
            dir="$HOME/flash-releases/$tag"
            if [ ! -f "$dir/SHA256SUMS" ]; then
              mkdir -p "$dir"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --dir "$dir" --clobber \
                -p 'rcbench-panel-p4-*.zip' -p 'rcbench-iomcu-*.zip' \
                -p '*-merged-*.bin' -p '*-merged-*.bin.sig' -p SHA256SUMS
            fi
            # A release before the partition table has no file: its entry
            # names no range to erase.
            git show "$tag:firmware/iomcu/partitions.json" \
              > "$dir/iomcu-partitions.json" 2>/dev/null \
              || rm -f "$dir/iomcu-partitions.json"
          done < "$RUNNER_TEMP/tags.txt"

      - name: Write the manifests
        run: |
          python3 tools/flash_manifest.py build \
            --releases "$HOME/flash-releases" \
            --list "$RUNNER_TEMP/releases.json" --out flash-fw \
            | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh flash-fw

      - name: Keep the firmware folder
        uses: actions/upload-artifact@v7
        with:
          name: flash-fw
          path: flash-fw
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish to GitHub Pages
    # always(): core, smoke and matrix are skipped in a run that is not a
    # full one, and a skipped need would skip the deploy.  A failed or
    # cancelled job stops it.
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' && needs.help.result == 'success' &&
      needs.api.result == 'success' && needs.flasher.result == 'success' &&
      needs.flasher-e2e.result == 'success' &&
      needs.flash-fw.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [changes, core, build, smoke, matrix, help, api, flasher,
            flasher-e2e, flash-fw]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: configurator-dist
          path: dist

      # The help goes into a folder the configurator does not have, so no
      # file of the configurator is replaced.
      - name: The configurator has no help folder
        run: test ! -e dist/help

      - uses: actions/download-artifact@v8
        with:
          name: help-site
          path: dist/help

      - name: The configurator has no api folder
        run: test ! -e dist/api

      - uses: actions/download-artifact@v8
        with:
          name: api-reference
          path: dist/api

      # The flasher goes into flash/, its images into flash/fw/: folders
      # neither the configurator nor the flasher build has.
      - name: The configurator has no flash folder
        run: test ! -e dist/flash

      - uses: actions/download-artifact@v8
        with:
          name: flasher-dist
          path: dist/flash

      - name: The flasher has no fw folder
        run: test ! -e dist/flash/fw

      - uses: actions/download-artifact@v8
        with:
          name: flash-fw
          path: dist/flash/fw

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
