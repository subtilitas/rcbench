name: Host build dependencies
description: >-
  The compiler, build tools, fonts and Python packages the host suite and
  the checks that render screens need.  Runs after the checkout.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/apt-prepare

    # The .deb files the install below downloads, kept between runs.  A slow
    # mirror trickles data and so never trips apt's 30s timeout: cmake's
    # 14.1MB and valgrind's 15.7MB then take minutes each.  With the files
    # cached, apt-get downloads only what changed since the cache was saved.
    # The key changes with this file, so a new package list starts afresh.
    - name: Restore the downloaded packages
      uses: actions/cache@v6
      with:
        path: ~/.apt-archives
        key: apt-host-deps-${{ runner.os }}-${{ hashFiles('.github/actions/host-deps/action.yml') }}

    - name: Install build dependencies
      shell: bash
      run: |
        mkdir -p ~/.apt-archives/partial
        sudo apt-get install -y --no-install-recommends \
          -o Dir::Cache::Archives="$HOME/.apt-archives" \
          cmake ninja-build gcc fonts-dejavu-core valgrind
        # apt writes as root; the cache step saves as the runner's user.
        sudo chown -R "$(id -u):$(id -g)" ~/.apt-archives
        python3 -m pip install pillow==12.3.0
